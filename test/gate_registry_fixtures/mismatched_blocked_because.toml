# test/gate_registry_fixtures/mismatched_blocked_because.toml — SYNTHETIC,
# hand-written.
#
# Check 12's MISMATCH fixture (#2595), the more interesting half: the script DOES
# name a capability, and it is the wrong one. `run` points at test/anchored.sh,
# which the gate writes into the throwaway root carrying
# `# blocked-because: concurrent-spawn`, while the entry declares
# `blocked:detached-process`. Both sides are well-formed; only the comparison
# catches it. This is the shape a row takes once one of the two capabilities it
# was waiting for lands and only one file is updated.

[[gate]]
name = "anchored"
area = "fixture"
shard = "a"
project = "compiler"
tiers = ["merge"]
cost = "cheap"
kind = "exec"
migration = "blocked:detached-process"
run = "test/anchored.sh"
oracles = []
sources = []
corpus = []
toolchain = []

[[gate]]
name = "tidy"
area = "fixture"
