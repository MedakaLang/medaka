# The control for invalid_cost.toml: byte-identical except `cost = "cheap"`,
# a valid class. `medaka gate verify` must report 0 violations against this
# one — otherwise the new check in invalid_cost.toml would be proving nothing
# (a check that reds everything is as useless as one that reds nothing).

