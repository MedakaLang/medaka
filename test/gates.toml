# test/gates.toml — the gate registry (#2176, epic #2182).
#
# FULL ENROLMENT (S-2, #2191). Every gate reachable via test/run_gates.sh
# pattern resolution or named literally in a workflow `run:` step is enrolled
# here — the candidate universe is exactly test/preflight.sh's own
# `_gate_candidates` (tracked-or-untracked `*.sh` MINUS every name in
# test/CI-COVERAGE-TOOLS.txt), so the entry count and that candidate count
# agree by construction, not by luck. The first eight entries are S-1's pilot,
# unchanged; the rest were appended in S-2. This is now the registry of
# record: `medaka gate list`/`verify`/`explain` read it directly, and
# `ci.yml`'s `gates` job-matrix is GENERATED from it by `make gen-ci` (S-2) —
# hand-editing that matrix is stale practice a drift check now catches
# (`medaka gate ci --check`, run by the required `diff_compiler_ci_gen_drift.sh`
# and by the required `diff_compiler_ci_shard_coverage.sh`). test/preflight.sh and
# test/build_oracles.sh do not read this file yet; that migration is ordered
# and tracked as separate, later changes (GATE-REGISTRY-DESIGN.md §6).
#
# Schema: docs/ops/GATE-REGISTRY-DESIGN.md §2. Every field is REQUIRED on every
# entry, list fields included — an absent list is a read error, not an empty
# list.
#
# ── `migration` (#2591, epic #2600) ──────────────────────────────────────────
#
# Where this check ENDS UP under the testing-architecture epic, or the named
# prerequisite that has to be discharged before a destination can be picked.
# One of `native-wrap`, `native-rewrite`, `shell:trust-anchor`,
# `shell:instrumentation`, `shell:external-harness`, `split-first`,
# `inverted-polarity`, `done`; each is defined in GATE-REGISTRY-DESIGN.md §2
# and in compiler/tools/gate_cmd.mdk's entry-schema comment. `medaka gate
# verify` checks the value against that set.
#
# A `shell:*` value is an EXEMPTION — this gate is never going native — so it
# is PAIRED with the script rather than taken on this file's word: the `run`
# target must carry a `# shell-because: <class> …` header line naming the same
# class, and `verify` reds when it is absent or names a different one. Every
# other value needs no header; `native-wrap` in particular is the release valve
# and requires nothing built first.
#
# The 2026-09-03 seeding classified all 256 entries against
# docs/ops/TESTING-INVENTORY.md, that day's survey of what each script is.
#
# ── `shard` / `[[shard]]` (S-1, #2177) ───────────────────────────────────────
#
# `shard` is the ci.yml `gates` job-matrix ROW this gate runs in, and
# `[[shard]]` (at the bottom of this file) is that row's runner options and
# provenance. Together they are the scheduling facts the hand-written matrix in
# `.github/workflows/ci.yml` used to hold and this registry did not: which row,
# with what options, and why.
#
# ⚠️ DERIVED OUTPUT, NOT HAND-ASSIGNED DATA (S-4, #2178). DO NOT EDIT A
# `shard` VALUE BY HAND. Every one of them is chosen by
#
#     medaka gate balance          # packs gates onto rows from measured cost
#     make gen-ci                  # regenerates ci.yml's matrix to match
#
# from the per-gate costs in test/gate_cost_baseline.json, subject to each
# row's toolchain (`wasm_arm`) and closure (`full_cores`) flags, and to an
# enforced pole/floor budget. Run those two commands, in that order, and
# commit both files together — committing one without the other reds the
# required test/diff_compiler_ci_shard_coverage.sh by construction.
#
# A hand edit REDS A REQUIRED CHECK. `test/diff_compiler_ci_gen_drift.sh` (the
# required `ci-gen-drift` context) runs BOTH halves: `medaka gate ci --check`
# proves ci.yml agrees with this file, and `medaka gate balance --check` proves
# this file agrees with the cost baseline. The first alone is satisfied by a
# self-consistent hand edit — edit `shard`, run `make gen-ci`, and the registry
# and the workflow agree with each other about a row nothing derived. The
# second is what closes that.
#
# A NEW `[[gate]]` still needs SOME `shard` value — the schema requires the
# field and it cannot be omitted pending the next balancer run. Write the row
# you would guess (or `other-job` if some job outside the matrix runs it).
# 🚨 `medaka gate balance` HARD-REFUSES on a gate with no row in the cost
# baseline — which every brand-new gate is, by construction, until an
# unnarrowed CI run measures it. So this commit CANNOT also run the balancer.
# Expect `ci-gen-drift` to red on this PR until the next baseline re-ingest
# (workflow_dispatch/merge_group/push/schedule) folds the new gate in, then
# run `medaka gate balance && make gen-ci` as a small follow-up commit — or,
# to get a real placement before merging, `gh workflow run ci.yml --ref
# <branch>` on this gate's own branch first.
#
# `shard` is REQUIRED on every entry and is one of the eight row names —
# `engines sqlite pds frontend types eval backend tools` (these are also
# required status-check contexts, `gates (<name>)`, so a row name is not free
# to change) — or the sentinel:
#
#   `other-job`  This gate is not scheduled by the `gates` matrix at all.
#                It runs, but some OTHER workflow job runs it (`soundness`,
#                `seed-health`, `wasm`, the docs jobs, `nightly`, the
#                playground job). 29 entries today (derive: `grep -c '^shard =
#                "other-job"$' test/gates.toml` — this count rots on every
#                enrolment/removal, so re-derive rather than trust it). It does NOT mean
#                "unscheduled" — which job is a fact this slice deliberately
#                did not invent; see docs/ops/GATE-REGISTRY-DESIGN.md §7.
#
# A `[[shard]]` row carries:
#
#   name        the row name, matching the `shard` values above
#   full_cores  the row's `full_cores: "1"` matrix key (absent in ci.yml when
#               false — a bool here, emitted as the key only when true)
#   wasm_arm    likewise the row's `wasm_arm: "1"` key
#   pinned_gates
#               the row's DECLARED membership. On a `full_cores` row this is
#               exactly the gates that must name it, and `medaka gate balance`
#               refuses when the registry disagrees in EITHER direction — a
#               gate hand-moved onto the row, or a pinned one hand-moved off.
#               On an open row it is `[]`: that row's membership is the
#               balancer's output, so declaring it would be prose the tool
#               ignores (and is itself refused).
#               ⚠️ This is the one membership fact no cost measurement can
#               derive. `engines` exists because `diff_compiler_engines` needs
#               a whole runner; its two row-mates ride along for the same wasm
#               toolchain. Widening or narrowing that list is a deliberate,
#               reviewable decision about CI capacity — never a side effect of
#               a re-ingest, and never something the balancer adopts because
#               it found it committed.
#   rationale   PATH to a plain-text file describing that ROW — what
#               `full_cores`/`wasm_arm` mean for it and which gates it can
#               legally take: test/gate_shards/<name>.txt. Emitted verbatim as
#               the row's comment block in ci.yml, one line per line.
#               ⚠️ It describes the ROW, never a gate's placement — placement
#               is the balancer's output and changes whenever the baseline
#               does, so prose narrating it would rot on every re-ingest.
#
# The prose lives in a file rather than in this TOML because the reader's TOML
# subset has no multi-line string (a `"""` is a hard parse error, by design),
# and rather than staying a hand-edited region of ci.yml because ci.yml is now
# a GENERATED file — a generated artifact with hand-edited islands is the
# hybrid this epic exists to remove. `.txt`, not `.md`, keeps
# it out of the markdown link/symbol gates, which would police prose that is
# deliberately a verbatim copy of shell/YAML commentary.
#
# ── `tiers` (S-tier-is-data, #2181) ──────────────────────────────────────────
#
# `tiers` is the SET OF RUNS a gate has. It replaced a single `tier = "merge" |
# "nightly" | "ondemand"` string, which could not say what the tree already
# did: `diff_compiler_eval_scaling` and `diff_compiler_perf_scaling` each run
# BOTH on the merge path and in nightly, and both were recorded as plain
# `merge` — the nightly half of each was invisible to every consumer of this
# file. (A third entry, `registry_keying_ratchet`, was recorded `ondemand`
# while test/typecheck_compiler_source.sh runs it on every merge.)
#
# Each element is a RUN TOKEN, `<tier>` or `<tier>/<mode>`:
#
#   merge     runs on the PR / merge-queue path — a `gates` matrix row, a
#             named ci.yml step, or a script one of those runs.
#   nightly   runs in .github/workflows/nightly.yml.
#   ondemand  nothing invokes it automatically. Appears ALONE, never with a
#             mode: there is no invocation for a mode to differ from.
#   /<mode>   the INVOCATION DELTA — the comma-joined, sorted `KEY=VALUE`
#             environment assignments the invoking step sets that change what
#             the gate does. DATA, not a label: `nightly/PERF_DEEP=1` says
#             exactly what makes that run different, which is what lets the
#             drift gate CHECK it rather than take a word for it.
#
# ⚠️ A bare `nightly` beside a bare `merge` is a positive claim of DUPLICATION
# — the two runs are the identical invocation. `diff_compiler_eval_scaling`
# carried exactly that at S-tier-is-data landing, deliberately: recording the
# duplication was that slice's job; deciding whether to demote, dedupe or keep
# it was explicitly deferred. S-charter-and-inventory (#2181) made the call:
# DEMOTED to `tiers = ["nightly"]` — the merge-path run was the identical
# invocation already covered nightly (no `/mode` delta, unlike
# `diff_compiler_perf_scaling`'s genuine `nightly/PERF_DEEP=1` breadth arm),
# so the merge-tier copy paid full cost for zero additional coverage. Charter
# clause N1 (docs/ops/CI-ARCHITECTURE.md §3.6): cost above threshold, the
# gate's own nightly job comment already called it "lower per-PR value" before
# this slice made it structural.
#
# ⚠️ DERIVED-AND-CHECKED, not a judgment call. `test/diff_compiler_tier_drift.sh`
# re-derives every entry's run set from .github/workflows/*.yml (real `run:`
# step invocations, plus one closure step through the gate scripts those
# invoke, plus the `gates` matrix membership `shard` already carries) and reds
# when a declared set differs. `medaka gate verify` separately checks the SHAPE
# (non-empty, sorted, unique, known tier names, `ondemand` alone).
#
# ── `sources` / `corpus` (S-5, #2191) ────────────────────────────────────────
#
# `sources` are GLOBS (`*` crosses `/`, `?` is one char) matched against a
# changed path; `corpus` values are literal DIRECTORIES, and a changed path is
# in one when it IS that directory or lives under it. `medaka gate explain
# <path>` unions the two. Both were DERIVED from test/preflight.sh, not
# hand-listed:
#
#   * `sources`  — each `case` arm's path pattern(s), attached to every gate
#     the arm's `add '<pattern>'` calls resolve to (run_gates.sh's two-glob
#     rule); plus the self-run arm (a changed gate script runs itself), the
#     manifest-derived `<project>/*` arm, the second-pass snapshot/selfproc
#     loop, and `need_fixpoint` (compiler/backend/* -> selfcompile_fixpoint).
#   * `corpus`   — preflight's own fixture-consumer derivation (`_consumes`:
#     a live, non-comment, word-bounded reference to the directory in the gate
#     script or in one script it invokes) run over the same candidate universe.
#
# ⚠️ TWO THINGS ARE NOT IN HERE ON PURPOSE, because they are REGISTRY-LEVEL
# POLICY and not per-gate facts (design doc §2):
#
#   1. BLAST RADIUS. `compiler/support/*`, `compiler/entries/*`, `stdlib/*` and
#      `runtime/*` select the WHOLE suite. Writing that as a `sources` glob on
#      every entry — so every gate "matches" stdlib — would make every entry's
#      data a lie about what that gate reads. preflight keeps the same split:
#      `mark_full` is its own function, not another `add` arm.
#   2. FAIL-OPEN. A non-prose path no entry claims widens to the whole suite
#      ([W-THIRD-CONSUMER]); it is never a silent "selects nothing".
#
# ⚠️ `sources = ["*"]` (the two whole-tree sources, diff_compiler_source_bytes
# and diff_compiler_comment_shout_diff) is a WHOLE-TREE source: each such gate
# re-scans every tracked file whatever changed. It matches every path
# by construction, so `explain` deliberately does NOT let it establish that a
# path is mapped — otherwise the fail-open rule could never fire again.
# preflight draws the same line: its unconditional `add` for each of the two
# sits outside the case table whose misses it reports as UNMAPPED.
#
# An entry with `sources = []` AND `corpus = []` is a gate NOTHING in
# preflight's path->gate map selects today — it runs because a ci.yml shard
# pattern names it, not because a changed path derived it. That is recorded,
# not invented around: see the S-5 report's Notes for the list and why each is
# empty.
#
# `name` is the name `test/run_gates.sh` resolves (it globs BOTH `test/<name>.sh`
# and `<name>.sh` from the repo root — test/run_gates.sh:172-181), which is why
# the sqlite entry's name carries its path and the wasm entry's does not.

# A plain compiler differential that reads an oracle binary.
[[gate]]
name = "diff_compiler_parse_result"
area = "frontend"
shard = "gates_8"
project = "compiler"
tiers = ["merge"]
cost = "cheap"
kind = "exec"
migration = "native-rewrite"
run = "test/diff_compiler_parse_result.sh"
oracles = ["parse_result_main"]
sources = ["compiler/frontend/ast.mdk", "compiler/frontend/lexer.mdk", "compiler/frontend/parser.mdk", "test/diff_compiler_parse_result.sh"]
corpus = ["test/parse_error_fixtures"]
toolchain = []

# A second oracle-reading differential, in a different area — the pair is what
# proves `area:` discriminates rather than just echoing `project:`.
[[gate]]
name = "diff_compiler_eval_modules"
area = "eval"
shard = "gates_8"
project = "compiler"
tiers = ["merge"]
cost = "medium"
kind = "exec"
migration = "native-rewrite"
run = "test/diff_compiler_eval_modules.sh"
oracles = ["eval_modules_main"]
sources = ["compiler/eval/*", "compiler/frontend/desugar.mdk", "compiler/ir/core_ir_eval.mdk", "compiler/backend/private_mangle.mdk", "test/diff_compiler_eval_modules.sh"]
corpus = ["test/eval_modules_fixtures"]
toolchain = []

# ⚠️ INVERTED POLARITY ([G-MUST-FAIL]): every fixture under
# test/must_fail_fixtures/ pins an OPEN bug, so RED is this gate's healthy
# state. It is enrolled here precisely to prove the schema does NOT normalize
# polarity — there is no ok/failing field, and nothing in an entry claims what
# a passing run looks like. Whatever runs a gate keeps owning that.
[[gate]]
name = "diff_compiler_must_fail"
area = "soundness"
shard = "other-job"
project = "compiler"
tiers = ["merge"]
cost = "medium"
kind = "exec"
migration = "inverted-polarity"
run = "test/diff_compiler_must_fail.sh"
oracles = []
sources = ["test/diff_compiler_must_fail.sh"]
corpus = ["test/must_fail_fixtures"]
toolchain = []

# An infra/ratchet gate that reads no oracle and builds nothing. Since S-4
# (#2177) it reads the REGISTRY for shard membership instead of parsing
# ci.yml's matrix, so `test/gates.toml` and `gate_cmd.mdk` are now sources of
# its verdict — matching the two `add` lines S-4 gave preflight's arms.
[[gate]]
name = "diff_compiler_ci_shard_coverage"
area = "infra"
shard = "gates_7"
project = "compiler"
tiers = ["merge"]
cost = "cheap"
kind = "exec"
migration = "shell:trust-anchor"
run = "test/diff_compiler_ci_shard_coverage.sh"
oracles = []
sources = ["compiler/tools/gate_cmd.mdk", "test/diff_compiler_ci_shard_coverage.sh", "test/gates.toml", ".github/workflows/ci.yml"]
corpus = []
toolchain = []

