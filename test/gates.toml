# S-test-runs (#2527: make pds/test/*_test.mdk actually run; tracking #2652).
# Drives `medaka test` over the 15 pds/test/*_test.mdk files (~338 `test`
# decls: ECDSA, RFC 6979, secp256k1, field/scalar arithmetic, HTTP framing) so
# they are asserted on every merge instead of running nowhere in CI.
#
# `shard` below is a placeholder ([W-SHARD-DERIVED], #2178): this gate has no
# row in test/gate_cost_baseline.json yet, so `medaka gate balance` must place
# it for real at end-of-sprint discharge.
[[gate]]
