# yet, so `medaka gate balance` HARD-REFUSES to place it until an unnarrowed
# CI run measures it, and `ci-gen-drift` reds until the follow-up `medaka gate
# balance && make gen-ci` commit — expected, not a bug in this slice.
[[gate]]
name = "dist_install_smoke"
area = "infra"
shard = "gates_4"
project = "compiler"
tiers = ["merge"]
cost = "medium"
kind = "exec"
migration = "native-wrap"
run = "test/dist_install_smoke.sh"
oracles = []
sources = ["test/dist_install_smoke.sh", "scripts/make_dist.sh", "Makefile"]
corpus = []
toolchain = []

