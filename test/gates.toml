# The gate registry's own drift gate (#2176 S-4) — `area = "infra"` alongside
# diff_compiler_ci_shard_coverage, its closest sibling: both police the map
# between what exists on disk and what a consumer believes exists, rather
# than checking compiler output (which would argue for "soundness", the area
# diff_compiler_project_enrolment/diff_compiler_ci_guard_failsafe use).
[[gate]]
name = "diff_compiler_gate_registry"
area = "infra"
shard = "types"
project = "compiler"
tier = "merge"
cost = "cheap"
kind = "exec"
run = "test/diff_compiler_gate_registry.sh"
oracles = []
sources = ["compiler/tools/gate_cmd.mdk", "test/diff_compiler_gate_registry.sh", "test/gates.toml"]
corpus = []
toolchain = []

# The generated gates-matrix region's own drift gate (#2177, S-3): compare
# `.github/workflows/ci.yml` against what the registry generates, via the
# non-mutating `medaka gate ci --check` (F-1 — regenerating first would heal an
# uncommitted hand-edit inside the region before a diff could see it). Not
# binary-free (same accepted gap as diff_compiler_gate_registry above);
# shard="other-job" because it has its own CI job (ci-gen-drift), not a `gates`
# matrix row. This gate is itself REQUIRED (`ci-gen-drift` is one of the
# ruleset's required contexts — derive, don't trust this comment,
# AGENTS.md [W-REQUIRED-CHECKS]); the same `--check` call also runs inside
# the REQUIRED diff_compiler_ci_shard_coverage, as an independent proof that
# does not depend on this gate's own tier.
[[gate]]
name = "diff_compiler_ci_gen_drift"
area = "infra"
shard = "other-job"
project = "compiler"
tier = "merge"
cost = "cheap"
kind = "exec"
run = "test/diff_compiler_ci_gen_drift.sh"
oracles = []
sources = ["compiler/tools/gate_cmd.mdk", "compiler/tools/gate_cost.mdk", "test/diff_compiler_ci_gen_drift.sh", "test/gates.toml", "test/gate_cost_baseline.json", ".github/workflows/ci.yml"]
corpus = []
toolchain = []

# The per-gate COST TRANSPORT's own gate (#2178, S-1-S-cost-record). Grades the
# poisoning guard on both halves — that `test/run_gates.sh` refuses to PRODUCE a
# timing report on a `pull_request` run (the one event ci.yml narrows) and that
# `test/gate_cost_ingest.sh` refuses to ADMIT a report tagged with one — plus the
# median arithmetic and the committed baseline's internal agreement. Binary-free
# and oracle-free: it builds a scratch tree with one fake gate rather than
# running any real one, so it costs milliseconds. shard="other-job" because it
# has its own CI job (`gate-cost`), not a `gates` matrix row — placing it in a
# row would have meant regenerating the matrix, which is a separate slice's work.
[[gate]]
name = "diff_compiler_gate_cost"
area = "infra"
shard = "other-job"
project = "compiler"
tier = "merge"
cost = "cheap"
kind = "exec"
run = "test/diff_compiler_gate_cost.sh"
oracles = []
sources = ["test/run_gates.sh", "test/gate_cost_ingest.sh", "test/diff_compiler_gate_cost.sh", "test/gate_cost_baseline.json"]
corpus = []
toolchain = []

# The SHARD BALANCER's own gate (#2178, S-3-S-balancer). Grades the four
# properties that make `medaka gate balance` safe to run unattended, each of
# which fails SILENTLY if it regresses — a wrong packing still yields a
# well-formed registry and eight green `gates (<row>)` checks. (1) Running it
# twice on an unchanged baseline is a byte-identical no-op, proved by diff
# rather than by the tool's own verdict. (2) The hysteresis band never
# preserves an ILLEGAL assignment: a gate needing wasm-tools on a row without
# it is repaired even when the legal move is worth 10ms of a 310ms pole — the
# first draft damped exactly that and exited 0. (3) A schedulable gate with no
# row in the cost baseline is a REFUSAL, never a zero (the baseline is keyed by
# run_gates.sh's gate label, not the registry's `name`, and the two agree only
# for gates under test/). (4) When the pole/floor budget is missed against a
# floor set by one indivisible gate, the refusal names that gate and says it
# has to get FASTER rather than blaming the packing. (5) The budget grades the
# PACKING and not the suite: speeding up every non-pole gate must not red it
# (it did, under the retired pole/median), while a real packing failure still
# must. Plus a `--check` that the committed shard assignment IS the
# balancer's output. Oracle-free; needs only ./medaka.
#
# shard="other-job" because it tests SCHEDULING and so must not be scheduled by
# the thing it grades: a balancer bug that mis-packs the matrix would move this
# gate too, and a check cannot be a member of the set it certifies.
#
# Runs as the `gate-balance:` job in ci.yml (added by S-4, alongside
# `diff_compiler_gate_cost`'s `gate-cost:` job).
[[gate]]
name = "diff_compiler_gate_balance"
area = "infra"
shard = "other-job"
project = "compiler"
tier = "merge"
cost = "cheap"
kind = "exec"
run = "test/diff_compiler_gate_balance.sh"
oracles = []
sources = ["compiler/tools/gate_cmd.mdk", "compiler/tools/gate_cost.mdk", "test/diff_compiler_gate_balance.sh", "test/gate_cost_baseline.json", "test/gates.toml"]
corpus = ["test/gate_balance_fixtures"]
toolchain = []



