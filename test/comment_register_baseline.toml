# comment-register count baseline — GENERATED, never hand-edited (#3034).
#
# One [[entry]] per (file, class) with a nonzero count, over the 8
# per-LINE-count comment-register classes test/comment_register_census.sh
# computes: history, ruling, tombstone, emoji, draft, deictic, dead-path,
# shout. A file may drop below its count freely; exceeding it is an
# error, and so is having a nonzero count for a class with no row here
# at all.
#
# OUT OF SCOPE (not baselined here): class 9 (comment-block essays) counts
# RUNS of consecutive comment lines, not individual lines — a different
# counting mechanism from every class above; class 7 (falsified-by-
# refactor candidates) is not independently greppable — its hits ARE
# class 5's (draft narration) hit list, needing human judgment, not a
# regex count.
#
# Enforced by .githooks/pre-commit check 6b (per staged file) and by
# test/diff_compiler_comment_shout_diff.sh (whole tree, so --no-verify
# cannot smuggle a rise past the hook).
#
# Regenerate from the repo root, never by hand:
#
#   sh test/comment_register_census.sh --write test/comment_register_baseline.toml
#
# Paths are relative to the repo root, matching every consumer above.

