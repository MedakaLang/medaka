# lint finding-count baseline — GENERATED, never hand-edited (#2619).
#
# One [[entry]] per (file, rule) with at least one finding: the number of
# findings that file is currently ALLOWED for that rule.  A file may drop
# below its count freely; exceeding it is an error, and so is having
# findings for a rule with no row here at all.
#
# Enforced by .githooks/pre-commit (BASELINED_LINT_RULES, per staged file)
# and by test/diff_compiler_lint_baseline.sh (whole tree, so --no-verify
# cannot smuggle an increase past the hook).
#
# Regenerate from the repo root, never by hand:
#
#   sh test/diff_compiler_lint_baseline.sh --write
#
# Paths are relative to the directory `medaka lint` runs in (the repo root
# for both consumers above).

