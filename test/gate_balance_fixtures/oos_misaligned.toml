# test/gate_balance_fixtures/oos_misaligned.toml — SYNTHETIC, hand-written.
#
# THE COUNT COINCIDENCE, PINNED (FR-1, #2222 review S0-1). This is the exact
# shape that made the S-2 block print a confident wrong number at exit 0.
#
# `test/gate_cost_ingest.sh` trims `runs[]` by ROW count and each gate's `ms`
# by SAMPLE count, independently. `oos_misaligned.json` is what that produces
# after one more ingest in which a gate failed once: `runs[]` retains runs
# 2/3/4 (run 1 aged out by the ROW trim) while both gates still hold three
# samples — from runs 1, 2 and 4, because each failed run 3 and each kept its
# older run-1 sample under the SAMPLE trim.
#
# So `samples == 3` equals the three distinct retained runIds, and the old
# count admission passed. It then read `ms[0]` as run 2's, `ms[1]` as run 3's
# and `ms[2]` as run 4's — none of which is true, and one of which (run 3)
# never happened for these gates at all.
#
# ⚠️ THE `ms` ARRAYS HERE ARE BYTE-IDENTICAL TO `oos_attributed.json`'S, ON
# PURPOSE. The old block's arithmetic was a function of `ms` and the run COUNT
# alone, so it printed for this file exactly what it printed for that one —
# mean |error| 72.2%, systematic bias -33.3%. The pair is therefore a direct
# read of the defect: same numbers in, one file where they mean that and one
# where they do not, and the fix is that only the first still gets an answer.
#
# The correct verdict here is NO NUMBER: attribution exists for all six
# samples (this is not the legacy case — see oos_legacy) and it still does not
# cover run 3, so the block must say so instead of folding.

[[gate]]
name = "m1"
area = "fixture"
shard = "a"
project = "compiler"
tiers = ["merge"]
cost = "cheap"
kind = "exec"
run = "test/m1.sh"
oracles = []
sources = []
corpus = []
toolchain = []

[[gate]]
name = "m2"
area = "fixture"
shard = "b"
project = "compiler"
tiers = ["merge"]
cost = "cheap"
kind = "exec"
run = "test/m2.sh"
oracles = []
sources = []
corpus = []
toolchain = []

[[shard]]
name = "a"
full_cores = false
wasm_arm = false
rationale = "test/gate_shards/a.txt"
pinned_gates = []

[[shard]]
name = "b"
full_cores = false
wasm_arm = false
rationale = "test/gate_shards/b.txt"
pinned_gates = []
