# test/gate_balance_fixtures/pin_intruder.toml — SYNTHETIC, hand-written.
#
# REVIEW FINDING F3(a), #2205: a gate hand-moved ONTO a closed row.
#
# `intruder` names the `full_cores` row `pin`, which declares only `pinned1`.
# Every other property this fixture has is DELIBERATELY healthy, because that
# is what made the real injection invisible: the packing is legal, every gate
# is costed, the open rows come out at 200ms each — an even packing, well
# inside the enforced pole/floor budget — and the derived assignment
# for the open rows is byte-identical to the committed one.
#
# So before the `pinned_gates` check existed, `medaka gate balance` on this
# registry SUCCEEDED: it seeded the closed row from whatever named it, adopted
# `intruder` permanently, and `--check` reported "already balanced". The only
# thing wrong here is a membership no cost measurement can derive, which is
# precisely why it has to be declared and checked rather than observed.

[[gate]]
name = "pinned1"
area = "fixture"
shard = "pin"
project = "compiler"
tier = "merge"
cost = "cheap"
kind = "exec"
run = "test/pinned1.sh"
oracles = []
sources = []
corpus = []
toolchain = []

