# test/gate_balance_fixtures/pin_deserter.toml — SYNTHETIC, hand-written.
#
# REVIEW FINDING F3(b), #2205: the PINNED gate hand-moved OFF its closed row.
#
# `pin` declares `pinned1`; `pinned1` is committed on the open row `a`, leaving
# the whole-runner row empty. This is the more dangerous half of F3, because a
# cost objective blind to the pin actively PREFERS it: on the real registry the
# same edit made the printed factor better (pole/median 1.005 against 1.073,
# under the metric #2216 retired), since
# idling a whole runner and stacking the suite's heaviest gate onto a shared
# one is what "balance the loads" means when nothing says the row is a pin.
#
# The costs and names here are chosen so that the desertion is otherwise
# invisible, the way the real one was: `pinned1` is the heaviest, so LPT places
# it first onto the first open row, which is exactly where the hand edit put
# it. The derived assignment therefore EQUALS the committed one, the projected
# packing is well inside budget, and before the `pinned_gates` check `medaka gate
# balance --check` exited 0 reporting "already balanced" — with the closed row
# holding nothing at all.

[[gate]]
name = "pinned1"
area = "fixture"
shard = "a"
project = "compiler"
tier = "merge"
cost = "cheap"
kind = "exec"
run = "test/pinned1.sh"
oracles = []
sources = []
corpus = []
toolchain = []

[[gate]]
name = "z1"
area = "fixture"
shard = "b"
project = "compiler"
tier = "merge"
cost = "cheap"
kind = "exec"
run = "test/z1.sh"
oracles = []
sources = []
corpus = []
toolchain = []

[[gate]]
name = "z2"
area = "fixture"
shard = "c"
project = "compiler"
tier = "merge"
cost = "cheap"
kind = "exec"
run = "test/z2.sh"
oracles = []
sources = []
corpus = []
toolchain = []

[[shard]]
name = "pin"
full_cores = true
wasm_arm = false
rationale = "test/gate_shards/pin.txt"
pinned_gates = ["pinned1"]

[[shard]]
name = "a"
full_cores = false
wasm_arm = false
rationale = "test/gate_shards/a.txt"
pinned_gates = []

[[shard]]
name = "b"
full_cores = false
wasm_arm = false
rationale = "test/gate_shards/b.txt"
pinned_gates = []

[[shard]]
name = "c"
full_cores = false
wasm_arm = false
rationale = "test/gate_shards/c.txt"
pinned_gates = []
