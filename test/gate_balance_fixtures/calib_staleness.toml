# test/gate_balance_fixtures/calib_staleness.toml — SYNTHETIC, hand-written.
#
# Discriminating fixture for the calibration staleness annotation (F-2,
# #2178 review S2-1). Row `a` carries TWO committed gates but its recorded
# run remembers only ONE (`calib_staleness.json`'s `runs[0].gates`) — a
# rebalance landed since that run, so the recorded residual describes a gate
# set that no longer exists. Row `b` carries ONE committed gate and its
# recorded run also remembers ONE, so it must print with no annotation —
# proving the mechanism is a real comparison, not a flag that always fires.
#
# Rows `c` and `d` are the SET half of the same question (S-2, #2223). Both are
# recorded at exactly the count they carry now, so the count comparison above
# reports clean for both and cannot tell them apart — which is the bug: the
# commonest rebalance is a SWAP, and a swap does not move a count. Row `c` had
# its one gate swapped (`swapped_out` left, `swapped_in` arrived), so its
# recorded `gatesDigest` is `swapped_out`'s and must not match; row `d` still
# carries the `stayed` it was recorded with, so its digest must match and its
# line must stay unannotated.
#
# The two digests in calib_staleness.json are a three-way agreement check, not
# two magic numbers: `gate_cost.gateSetDigest` computes the committed side,
# `_digest` in test/gate_cost_ingest.sh computed the recorded side, and row `d`
# starts failing the moment those two implementations disagree.
#
# `c` and `d` are CLOSED rows (`full_cores = true`) so the packer neither adds
# to nor removes from them: their membership is the fixture's input, and the
# only thing under test is what the calibration line says about it. On an open
# row the packer would decide the membership and the fixture would be asserting
# the packer's arithmetic instead of the staleness comparison.

[[gate]]
name = "small1"
area = "fixture"
shard = "a"
project = "compiler"
tier = "merge"
cost = "cheap"
kind = "exec"
run = "test/small1.sh"
oracles = []
sources = []
corpus = []
toolchain = []

