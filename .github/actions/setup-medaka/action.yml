name: 'Setup medaka'
description: >-
  Install the clang/libgc toolchain (optionally + sqlite3, the oracle for the
  sqlite/*.sh gates), optionally install the Node + wasm-tools wasm-arm
  toolchain, and optionally cold-bootstrap ./medaka from the checked-in seed
  (`make medaka`). Local composite action — the caller must already have
  checked out the repo (`actions/checkout@v4` stays inline in every job; a
  local composite action needs the repo present before it can run, so it
  cannot own checkout itself).
  #1936: collapses the copy-pasted toolchain / wasm-tools / version-pin
  sequence that used to live at eleven step sites across ci.yml plus its own
  set in nightly.yml into this one file. WASM_TOOLS_VERSION / WASM_NODE_VERSION
  now have exactly ONE definition tree-wide: the two input defaults below.

inputs:
  sqlite:
    description: >-
      'true' to also install sqlite3 — the oracle for the 22 sqlite/*.sh
      gates. Installed unconditionally by the `gates` job (every shard, not
      just the `sqlite` one — see that call site for why); every other job
      leaves this 'false'.
    required: false
    default: 'false'
  wasm:
    description: >-
      'true' to install the wasm arm toolchain: Node (wasm-node-version) via
      actions/setup-node, then the pinned wasm-tools release
      (wasm-tools-version), extracted OUTSIDE the checkout so it can never
      leave an untracked file behind for a shard's `git status --porcelain`
      drift check to trip on.
    required: false
    default: 'false'
  binary:
    description: >-
      What to produce after the toolchain is installed. 'build' runs
      `make medaka` (cold bootstrap from compiler/seed/emitter.ll.gz). Leave
      empty to install the toolchain only. (The `artifact` value — download a
      pre-built binary instead of building — is S-build-once's to add later,
      in this same file; do not add or stub it here.)
    required: false
    default: ''
  wasm-tools-version:
    description: 'wasm-tools release to install when `wasm` is true.'
    required: false
    default: '1.219.1'
  wasm-node-version:
    description: 'Node.js version to install when `wasm` is true.'
    required: false
    default: '24'

runs:
  using: 'composite'
  steps:
    - name: Install toolchain
      shell: bash
      run: |
        sudo apt-get update -qq
        if [ "${{ inputs.sqlite }}" = "true" ]; then
          sudo apt-get install -y clang libgc-dev sqlite3
        else
          sudo apt-get install -y clang libgc-dev
        fi

    - name: Set up Node.js ${{ inputs.wasm-node-version }} (wasm arm)
      if: inputs.wasm == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.wasm-node-version }}

    - name: Install wasm-tools (wasm arm)
      if: inputs.wasm == 'true'
      shell: bash
      env:
        WASM_TOOLS_VERSION: ${{ inputs.wasm-tools-version }}
      run: |
        set -eu
        v="$WASM_TOOLS_VERSION"
        url="https://github.com/bytecodealliance/wasm-tools/releases/download/v${v}/wasm-tools-${v}-x86_64-linux.tar.gz"
        # Extract OUTSIDE the checkout. `tar xz` in the workspace leaves
        # `wasm-tools-${v}-x86_64-linux/` behind after the binary is moved out, and the
        # gates shards end with a review gate (`git status --porcelain`) that FAILS on any
        # untracked file — so unpacking here turns a toolchain install into a red shard.
        d="$(mktemp -d)"
        curl -sSfL "$url" | tar xz -C "$d"
        sudo mv "$d/wasm-tools-${v}-x86_64-linux/wasm-tools" /usr/local/bin/wasm-tools
        rm -rf "$d"
        wasm-tools --version

    - name: Build medaka (cold bootstrap from seed)
      if: inputs.binary == 'build'
      shell: bash
      run: make medaka
