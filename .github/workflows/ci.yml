name: CI

# GitHub-HOSTED runners. Free and unlimited for public repositories, 20 concurrent
# jobs on the Free plan. No self-hosted runner — a fork PR on a public repo with one
# is arbitrary code execution on the runner host. Do not reintroduce one.
#
# ── Oracles build per shard; the binary builds once ─────────────────────────────
# Two different questions. ORACLES: no gate needs all 54, so each shard builds only
# the handful its own gates read (`build_oracles.sh --for '<pattern>'`, the same
# derivation `test/preflight.sh` uses locally). THE BINARY (`build:` job, #1928): a
# pure function of the checkout, so it builds exactly once and the other jobs
# download it — never rebuilt per shard. History/measurements: dossier `ci.md`.
#
# The drift check (`git diff --exit-code` after the gates run) lives INSIDE each
# shard, not as a separate job — a fresh checkout in a fresh VM would never see
# drift caused by gates that ran somewhere else.
#
# ── Why the Medaka binary is not cached across runs (#111) ──────────────────────
# `./medaka`/`./medaka_emitter` depend on files that change on every non-docs
# compiler PR, so a correctness-safe cache key can never hit on the runs that need
# it. This is about cross-run CACHING and is unrelated to the `build:` job above,
# which is intra-run transport at a fixed SHA — no key, no cross-SHA restore.
# Per-shard `test/bin/*` oracle caches remain below; never add a partial
# `restore-keys` fallback, which would turn stale oracles into plausible greens.
#
# ── The PR run is NARROWED. The merge_group run is NOT. (T-15) ─────────────────
# `pull_request`: each `gates (…)` shard runs only the intersection of its pattern
# with the gate set `detect` derives from the diff. `merge_group` and `push`: every
# shard runs its full pattern, unconditionally, always.
#
# ⚠️ NEVER NARROW `merge_group`, AND NEVER NARROW `soundness`. The queue's whole
# value is testing the MERGED result — two independently-green branches have
# auto-merged into a broken tree with zero git conflicts more than once, and no
# per-PR check can see that. `soundness` is the backstop for a different hole: all
# gate shards pass on an ill-typed compiler (`make medaka` does not gate on type
# errors). Both stay full, on every event, forever. Narrowing fails SAFE in every
# direction (preflight erroring, reporting whole-suite blast radius, or having no
# opinion about a changed path all widen back to everything) — see the `gateset`
# step. Incident history: dossier `ci.md`.
#
# ── `push: main` REMOVED — the queue already covers it (#1927) ─────────────────
# Every commit reaching `main` was already tested by a `merge_group` run at that
# exact SHA (the queue only merges what went green there), so a separate
# `push: main` run was a byte-for-byte duplicate paid twice per merge for zero new
# signal. `schedule` below is the cheap safety net for anything that could still
# land outside the queue.
on:
  push:
    branches: [testing-arc]
  pull_request:
  # REQUIRED BY THE MERGE QUEUE — a queued PR is tested on a `merge_group` event, a
  # temp branch holding this PR merged onto everything already queued ahead of it.
  # Without this trigger the required checks never run on that branch, the entry
  # waits forever, and the queue DEADLOCKS. Do not remove it while a merge queue
  # exists. PR CI tests the BRANCH; the queue tests the MERGED RESULT — those have
  # diverged before (dossier `ci.md`). merge_group:
  merge_group:
  workflow_dispatch:
  # Safety net for #1927 (removed `push: main`) + the oracle-cache producer — a
  # genuine, unnarrowed full-suite run of `main` once a day (also reachable via
  # `workflow_dispatch` above). Its `oracle_key` is 'full', so it is the daily
  # producer of the cache a `merge_group` run restores from the default branch.
  schedule:
    - cron: '43 9 * * *' # arbitrary off-the-hour time, ahead of nightly.yml's 07:17

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Oracles are throwaway binaries; -O0 builds them much faster and their runtime is
  # hidden by parallelism. The emitter is the reused workhorse and stays -O2.
  ORACLE_OPT: -O0

  # The wasm toolchain pin (#1936) is NOT set here — it lives as the single
  # `wasm-tools-version` / `wasm-node-version` input default on
  # `.github/actions/setup-medaka/action.yml`, which every consumer (this file's
  # `gates`/`wasm` jobs, and nightly.yml) reads by not overriding it.

jobs:
  # ── T-4b: docs-only fast path ───────────────────────────────────────────────
  # A change that touches ONLY prose (top-level *.md, docs/**, LICENSE) skips the
  # heavy jobs' EXPENSIVE STEPS, never the jobs themselves. There are ELEVEN
  # required status checks with ZERO approvals — the checks ARE the merge gate —
  # so a job skipped by a job-level `if:`, or a workflow skipped by a
  # `paths-ignore:` trigger filter, never posts a status; the PR sits at
  # "Expected — waiting for status" FOREVER and becomes permanently unmergeable.
  # ⚠️ Do NOT convert this into a job-level `if:`, and do NOT path-filter `on:`.
  # Every required job always RUNS and always REPORTS; only its STEPS are
  # conditional.
  #
  # ⚠️ THE RULE: `test/**` is NEVER docs (it holds functional goldens, not prose —
  # a naive `**.md` filter would skip the gates that exist to catch a bad golden
  # re-cut). `docs/spec/SYNTAX.md` is likewise never docs — it is an executable
  # spec that `check_syntax_examples.sh` runs, and shipped false for months once
  # while nothing checked it. Both arms must come first in the case below.
  # Everything else ending in `.md` is prose. Scoped to the `.md` EXTENSION on
  # purpose — `.claude/`/`compiler/`/`runtime/` also hold executable non-`.md`
  # files that must fall through to the catch-all as NOT docs.
  #
  # Conservative in the direction that matters: any unrecognized path routes to
  # the full suite. Only meaningful for `pull_request`; every other trigger
  # defaults `docs_only=false`. Incident history: dossier `ci.md`.
  detect:
    name: detect docs-only change
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      narrow: ${{ steps.gateset.outputs.narrow }}
      gates: ${{ steps.gateset.outputs.gates }}
      oracle_key: ${{ steps.gateset.outputs.oracle_key }}
    steps:
      - uses: actions/checkout@v4

      - name: Classify changed files
        id: classify
        run: |
          set -u
          event="${{ github.event_name }}"
          # Consumed by `gateset` below; created unconditionally so that step never
          # has to distinguish "no non-docs files" from "the classifier bailed early".
          : > "$RUNNER_TEMP/changed.txt"
          : > "$RUNNER_TEMP/nondocs.txt"
          if [ "$event" != "pull_request" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "not a pull_request event ($event) — running the full suite."
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"

          git cat-file -e "$base" 2>/dev/null || git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || true
          git cat-file -e "$head" 2>/dev/null || git fetch --no-tags --depth=1 origin "$head" 2>/dev/null || true

          if ! git cat-file -e "$base" 2>/dev/null || ! git cat-file -e "$head" 2>/dev/null; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "could not resolve base/head commits locally — running the full suite (conservative default)."
            exit 0
          fi

          changed="$(git diff --name-only "$base" "$head" || true)"
          if [ -z "$changed" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "no changed files resolved — running the full suite (conservative default)."
            exit 0
          fi

          echo "changed files:"
          printf '%s\n' "$changed"

          # See the job header for why this is an ALLOWLIST, not a **.md denylist.
          printf '%s\n' "$changed" > "$RUNNER_TEMP/changed.txt"
          docs_only=true

          # ONE classifier, TWO consumers: `docs_only` answers "is EVERY changed file
          # prose?"; `gateset` below asks "is THIS file prose?" of the same allowlist,
          # so every "not prose" arm also names the file rather than keeping a second
          # list that could drift from this one.
          nondoc() { docs_only=false; printf '%s\n' "$1" >> "$RUNNER_TEMP/nondocs.txt"; }

          while IFS= read -r f; do
            if [ -z "$f" ]; then
              continue
            fi
            case "$f" in
              # test/ is NEVER docs — this arm must stay first. See the job header.
              test/*) nondoc "$f" ;;

              # SYNTAX.md is an executable spec, not prose. See the job header.
              docs/spec/SYNTAX.md) nondoc "$f" ;;

              docs/*) : ;;
              LICENSE|LICENSE.*) : ;;

              # Every other .md is prose. Scoped to the extension on purpose — see
              # the job header for why a bare directory glob would be wrong.
              *.md) : ;;

              *) nondoc "$f" ;;
            esac
          done < "$RUNNER_TEMP/changed.txt"

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "classified: docs_only=$docs_only"

      # ── T-15: narrow the `pull_request` run. NEVER the `merge_group` run. ────────
      # Only the `pull_request` half shrinks — narrowing `merge_group` would trade
      # away the one property that justifies the queue (testing the MERGED result).
      # `soundness`/`seed-health` likewise stay FULL on every event. Preflight is a
      # FILTER, not an AUTHORITY — CI on the merged tree is the authority. Incident
      # history: dossier `ci.md`.
      #
      # The derivation is `test/preflight.sh` — NOT reimplemented here, to avoid a
      # second, drift-prone copy of "which gates does this diff touch". Run in
      # `PREFLIGHT_DRY=1` mode (prints the derivation, builds nothing) against the
      # changed-file list `classify` already resolved (a shallow checkout has no
      # `main` to diff against, so `PREFLIGHT_CHANGED_FILE` parameterizes the INPUT
      # only, never the derivation).
      #
      # THREE ways this refuses to narrow, all failing SAFE (= run everything):
      #   1. preflight exits nonzero          -> a stale glob in its map, or a bug.
      #   2. preflight prints `FULL <reason>` -> whole-suite blast radius.
      #   3. preflight prints `UNMAPPED <p>`  -> no opinion about path <p>, and <p>
      #      is not prose per the SAME allowlist `classify` built (nondocs.txt).
      # A gate wrongly INCLUDED costs CI minutes, free on a public repo. A gate
      # wrongly EXCLUDED is a bug that reaches the queue. Bias accordingly, always.
      - name: Derive the gate set for this PR
        id: gateset
        run: |
          set -u
          full() {
            echo "narrow=false" >> "$GITHUB_OUTPUT"
            echo "gates=" >> "$GITHUB_OUTPUT"
            echo "oracle_key=full" >> "$GITHUB_OUTPUT"
            echo "▶ FULL SUITE: $1"
            exit 0
          }

          event="${{ github.event_name }}"
          [ "$event" = "pull_request" ] || full "event is '$event', not pull_request — the merge_group/push run is ALWAYS the full suite."
          [ "${{ steps.classify.outputs.docs_only }}" != "true" ] || full "docs-only change — every heavy step is skipped anyway."
          [ -s "$RUNNER_TEMP/changed.txt" ] || full "no changed files resolved (conservative default)."

          if ! PREFLIGHT_DRY=1 PREFLIGHT_CHANGED_FILE="$RUNNER_TEMP/changed.txt" \
                 sh test/preflight.sh > "$RUNNER_TEMP/pf.txt" 2>&1; then
            cat "$RUNNER_TEMP/pf.txt"
            full "test/preflight.sh FAILED to derive a gate set (see above) — refusing to narrow on a broken derivation."
          fi
          cat "$RUNNER_TEMP/pf.txt"
          echo

          if grep -q '^  FULL ' "$RUNNER_TEMP/pf.txt"; then
            full "preflight reports whole-suite blast radius:$(awk '$1=="FULL"{printf " %s", $2}' "$RUNNER_TEMP/pf.txt")"
          fi

          # Every UNMAPPED path must be prose, per the SAME allowlist the docs-only
          # classifier uses. nondocs.txt is that allowlist's verdict, file by file.
          leftover=""
          for u in $(awk '$1=="UNMAPPED"{print $2}' "$RUNNER_TEMP/pf.txt"); do
            if grep -qxF "$u" "$RUNNER_TEMP/nondocs.txt"; then
              leftover="$leftover $u"
            fi
          done
          [ -z "$leftover" ] || full "preflight has no opinion about these NON-PROSE paths:$leftover"

          gates="$(awk '$1=="GATE"{printf "%s ", $2}' "$RUNNER_TEMP/pf.txt")"
          gates="${gates% }"
          [ -n "$gates" ] || full "preflight derived ZERO gates from a non-docs diff — that must never be read as 'nothing to test'."

          # Keys the per-shard oracle cache (see the `gates` job). A narrowed run builds a
          # SUBSET of a shard's oracles, so its test/bin must never be restored by a full
          # run under the same key — that would skip the build step and leave the missing
          # oracles simply ABSENT. Different content, different key.
          key="$(printf '%s' "$gates" | sha1sum | cut -c1-12)"

          echo "narrow=true" >> "$GITHUB_OUTPUT"
          echo "gates=$gates" >> "$GITHUB_OUTPUT"
          echo "oracle_key=pr-$key" >> "$GITHUB_OUTPUT"
          echo "▶ NARROWED pull_request run: $(printf '%s\n' $gates | grep -c .) gate(s)."
          echo "  The merge_group run of this same PR still executes the FULL suite on the MERGED tree."

  # ── Build ./medaka ONCE per run, not ten times (#1928) ───────────────────────
  # `make medaka` is a pure function of the checkout, so it runs once here and the
  # other ten jobs (7 `gates` shards + `soundness` + `inlang` + `wasm`) take
  # `binary: artifact` on the same setup action instead of rebuilding it. This is
  # intra-run artifact transport at a fixed SHA, NOT a cache (see the file header's
  # #111 note) — no key, no cross-SHA restore.
  #
  # ⚠️ NOT one of the eleven required contexts, and must not become one — that
  # needs a ruleset edit, not atomic with a commit. ⚠️ `needs: detect` with a
  # CONDITIONAL STEP, never a conditional job — same shape and reason as every
  # heavy job below: a required consumer that `needs:` a skippable job can
  # dead-end, so this job always RUNS and always REPORTS.
  #
  # `seed-health` deliberately does NOT consume this artifact — it asks whether
  # the committed SEED still bootstraps, and must keep answering that from the
  # seed itself. History/measurements: dossier `ci.md`.
  build:
    name: build medaka once
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup medaka (toolchain + build)
        if: needs.detect.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-medaka
        with:
          binary: build

      # Both stamps are HIDDEN files, so `include-hidden-files: true` is mandatory —
      # upload-artifact@v4 silently drops dotfiles without it (a warning in the log,
      # a green step, and every consumer re-running stage A for nothing). Why the
      # stamp travels at all, and the same-SHA invariant that makes it sound, is
      # documented at the consuming step in .github/actions/setup-medaka/action.yml.
      #
      # `if-no-files-found: error`: an empty upload here would degrade ten jobs into
      # a download failure apiece, which is loud but points at the wrong place.
      #
      # Retention is 1 day: this artifact is scratch, meaningful only inside its own
      # run, and it is ~10 MB × every run of a busy repo.
      - name: Upload ./medaka + ./medaka_emitter + provenance stamp
        if: needs.detect.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: medaka-binaries
          path: |
            medaka
            medaka_emitter
            .medaka_emitter.srcstamp
            .medaka.srcstamp
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  gates:
    # `build` is added to `needs` so the binaries exist; `detect` stays for its
    # outputs. See the `if:` below for why this does NOT reintroduce the
    # skipped-required-context hazard the header warns about.
    needs: [detect, build]
    # ⚠️ MUST NEVER EVALUATE FALSE FOR A REASON OTHER THAN `detect` ITSELF FAILING —
    # this is a required context and a skipped job does not report. Without
    # `always()`, `build` failing would SKIP all seven shards, which GitHub reports
    # as a non-failure (RED -> GREEN-BY-SKIP, a severity increase). With it, the job
    # runs anyway, the download step fails, and the shard is correctly red.
    if: ${{ always() && needs.detect.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false          # one shard failing must not hide the others
      matrix:
        include:
          # Every gate in the repo lands in exactly ONE shard — verified by
          # test/diff_compiler_ci_shard_coverage.sh (0 missing, 0 duplicated). A gate
          # falling between shards would silently never run, which is the exact class
          # of rot this suite is being hardened against.
          #
          # Quoting is load-bearing on BOTH layers:
          #   * outer DOUBLE quotes -> one YAML scalar (a bare `'a' 'b'` is invalid
          #     YAML; it reads the first token and chokes on the rest);
          #   * inner SINGLE quotes -> survive into the shell so it does not expand
          #     the globs before run_gates.sh sees them.
          # And do NOT use brace expansion: run_gates.sh runs under POSIX sh (dash),
          # which does not expand braces, so it would glob to nothing.
          #
          # ── SHARDS ARE SCHEDULED BY COST, NOT BY THEME ─────────────────────────
          # Shard NAMES are thematic (they make a failure legible); the SCHEDULE is
          # not, because jobs run in parallel and total wall-clock is the SLOWEST
          # shard. So a gate lands wherever there is ROOM, not where its name says
          # — several gates below are placed far from their thematic home for
          # exactly this reason, each noted at its `pattern:` entry. Current
          # per-shard cost comes from `scripts/ci_shard_cost.sh`, run against
          # recent green `merge_group` runs — never hand-write a number here.
          # Placement history and every prior measurement: dossier `ci.md`.
          - name: engines
            # ALONE ON ITS RUNNER: the single most expensive gate in the suite and
            # irreducible — every fixture pays a full `medaka build` + clang, on
            # THREE engines. `full_cores` gives it the whole box rather than the
            # gate's own ENGINE_JOBS=NCPU/2 hedge (right when sharing a runner,
            # wasteful when not — it doesn't, here). `wasm_arm` (#597) installs
            # wasm-tools + Node and builds the Wasm oracle so this gate's T2/T3
            # tiers actually run; MEDAKA_REQUIRE_WASM=1 makes a degraded run a hard
            # fail so the wiring cannot silently rot back. diff_compiler_rejection_parity
            # (#709) rides along here, needing the same toolchain.
            # Re-derive current cost/critical-path: `sh scripts/ci_shard_cost.sh`.
            pattern: "'diff_compiler_engines' 'diff_compiler_rejection_parity'"
            full_cores: "1"
            wasm_arm: "1"
          - name: sqlite
            # The 22 differential gates that diff the pure-Medaka SQLite library
            # against the real sqlite3 CLI (T8), plus `gzip/test/*oracle` and
            # `pds/test/*` — all project oracles that drive `./medaka` directly and
            # read no `test/bin` oracle, parked here by cost (dossier `ci.md`).
            # NOTE the glob is `'*oracle'`, not `'*_oracle'`: one gate is plain
            # `oracle.sh`, not `<name>_oracle.sh` — the narrower glob silently
            # dropped it. NOTE `pds/test/*` is deliberately ONE directory level
            # deep so a future `pds/` in-language gate auto-enrolls with no
            # `ci.yml` edit, as long as it lands directly in `pds/test/` (see
            # `pds/README.md`'s CI classification policy).
            # `constant_time_parity` is covered by the PDS glob and needs the Wasm
            # arm, enabled here so the gate is enrolled exactly once.
            pattern: "'sqlite/test/*oracle' 'gzip/test/*oracle' 'pds/test/*'"
            wasm_arm: "1"
          - name: frontend
            # `native_fixtures/run` (T8) sits one directory below `test/`, so even
            # the coverage gate's `test/*.sh` glob could not see it — it ran
            # nowhere. `build_construct_coverage` (T-3, a BACKEND gate) and
            # `diff_compiler_wasm_shim_parity` (#370, a WASM gate) and
            # `diff_compiler_preflight_base` (#560, pure git) and
            # `diff_compiler_dict_semantics` (#616, a TYPES gate) are all parked
            # here by cost, not theme — each noted at length in dossier `ci.md`;
            # the short version is this shard has the room and each of them is
            # free-to-cheap wherever it lands.
            pattern: "'diff_compiler_lex*' 'diff_compiler_parse*' 'diff_compiler_snapshot*' 'diff_compiler_resolve*' 'diff_compiler_fmt' 'diff_compiler_fmt_roundtrip' 'diff_compiler_wasm_shim_parity' 'diff_compiler_preflight_base' 'diff_compiler_dict_semantics' 'native_fixtures/run' 'build_construct_coverage'"
          - name: types
            # `diff_compiler_shadow_semantics` (the SHADOW-SEMANTICS.md decision
            # matrix) lives here, not in `tools` beside its closest sibling
            # `diff_compiler_run_check_agreement`, because every stage it exercises
            # is in `compiler/types/typecheck.mdk`. Reads no oracle.
            pattern: "'diff_compiler_perf_scaling' 'diff_compiler_typecheck*' 'diff_compiler_check*' 'diff_compiler_exhaust' 'diff_compiler_diagnostics' 'diff_compiler_analyze_project' 'diff_compiler_shadow_semantics' 'effect_param_domain' 'effect_builtin_param_domain' 'effect_product_domain' 'effect_set_domain'"
          - name: eval
            # The 4 `bootstrap_*` stage gates are named individually, NOT globbed
            # as `bootstrap_*` — that glob also catches `bootstrap_from_seed.sh`,
            # which `seed-health` already owns. Everything else in this shard's
            # pattern beyond the `diff_compiler_eval*`/`core_ir*` families
            # (dispatch_shape, prelude_obj, slice_oob, ir_size, origin_agreement,
            # draft_semantic, anf_identity, import_order, test_native,
            # flat_vs_onemodule) is a BACKEND/FRONTEND/TYPES gate parked here by
            # cost, not theme, each measured and re-measured over many merge_group
            # runs — full placement history in dossier `ci.md`. Several share
            # oracle overlap with `core_ir_modules`/`eval_modules`, which this
            # shard already builds, so their true marginal cost is smaller than a
            # fresh oracle build elsewhere would be.
            pattern: "'diff_compiler_eval*' 'diff_compiler_core_ir*' 'diff_compiler_dispatch_shape' 'diff_compiler_prelude_obj' 'diff_compiler_slice_oob' 'diff_compiler_ir_size' 'diff_compiler_origin_agreement' 'diff_compiler_draft_semantic' 'diff_compiler_anf_identity' 'diff_compiler_import_order' 'diff_compiler_iface_order' 'diff_compiler_test_native' 'diff_compiler_flat_vs_onemodule' 'bootstrap_lex' 'bootstrap_resolve' 'bootstrap_typecheck' 'bootstrap_eval'"
          - name: backend
            # `build_cmd` (T8) is the end-to-end gate for the SHIPPING `medaka
            # build` CLI — 14 real programs, stdout diffed against a committed
            # golden. It was once misfiled as a "build helper" in
            # CI-COVERAGE-TOOLS.txt (a false claim that running it proves nothing
            # about the compiler), which made the coverage gate subtract it from
            # its own scope and certify full coverage while nothing invoked it —
            # see dossier `ci.md` for the incident it would have caught.
            # `diff_compiler_index_oob` (#1787) is parked here by cost, its nearest
            # sibling by shape (`diff_compiler_slice_oob`) sitting in `eval`
            # instead because the cost ranking has inverted more than once —
            # re-derive with `scripts/ci_shard_cost.sh` before moving either.
            pattern: "'diff_compiler_llvm*' 'diff_compiler_build' 'diff_compiler_rt_obj' 'diff_compiler_selfproc' 'diff_compiler_stack_overflow' 'diff_compiler_let_refute' 'diff_compiler_index_oob' 'diff_compiler_tmc_parity' 'selfcompile_lex' 'selfcompile_emit' 'selfcompile_build_fixpoint' 'diff_native_cli' 'diff_native_stack' 'build_cmd'"
          - name: tools
            # `diff_compiler_mcp` (#253) and `diff_compiler_entry_exit_codes`
            # (#440) are parked here by cost — both read no oracle and are a
            # handful of cheap invocations, while `engines`/`backend` (the two
            # heaviest shards) have no room to spare.
            # `diff_compiler_test_typecheck` (#1229) is named EXPLICITLY, not
            # globbed: its neighbour `diff_compiler_test` is an exact name, not a
            # glob, so a new sibling would silently never run — the exact hazard
            # `diff_compiler_ci_shard_coverage` exists to catch.
            pattern: "'diff_compiler_lint*' 'diff_compiler_lsp*' 'diff_compiler_mcp' 'diff_compiler_codemod' 'diff_compiler_repl' 'diff_compiler_new' 'diff_compiler_test' 'diff_compiler_test_typecheck' 'diff_compiler_ported' 'diff_compiler_doc' 'diff_compiler_index' 'diff_compiler_references*' 'diff_compiler_capability_matrix' 'diff_compiler_internal_extern' 'diff_compiler_effect*' 'diff_compiler_os_entropy' 'diff_compiler_entry_exit_codes' 'diff_compiler_run_check_agreement' 'diff_compiler_run_stdout_flush' 'diff_compiler_run_entry_subdir' 'diff_compiler_ci_shard_coverage' 'diff_compiler_perf_stage_census' 'diff_compiler_fixture_corpus_coverage' 'diff_compiler_source_bytes' 'diff_compiler_fmt_write_safety' 'check_syntax_examples' 'check_build_oracles_for_consistency' 'cross_project_deps' 'cross_project_twonames' 'manifest_emit' 'lsp_harness' 'diff_net' 'pr_helper_test'"
    name: gates (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      # ── WHAT DOES *THIS* SHARD ACTUALLY HAVE TO DO? ───────────────────────────────
      # ⚠️ NEVER GUARDED, AND NEITHER IS THE JOB — there are ELEVEN required checks
      # with ZERO approvals, and a job skipped by a job-level `if:` (or a workflow
      # skipped by `paths-ignore:`) never posts a status, leaving the PR permanently
      # unmergeable. So this job always RUNS and always REPORTS; only STEPS are
      # conditional, same shape as the docs-only fast path.
      #
      # Computes `has_work` (every expensive step below hangs off it) and `pats`
      # (the concrete gate list to run) — and prints BOTH the gates it will run and
      # every gate in the shard it will NOT, by name, on every run. A preflight
      # that quietly under-reports its own coverage is the exact failure this
      # suite exists to prevent.
      - name: Plan this shard
        id: plan
        env:
          DOCS_ONLY: ${{ needs.detect.outputs.docs_only }}
          NARROW: ${{ needs.detect.outputs.narrow }}
          DERIVED: ${{ needs.detect.outputs.gates }}
        run: |
          set -u

          # Expand THIS shard's patterns into repo-relative gate paths, resolving against
          # BOTH `test/` and the repo root — the SAME rule run_gates.sh, build_oracles.sh
          # --for and diff_compiler_ci_shard_coverage.sh use. All four must agree, or CI
          # would certify coverage of a gate that silently never ran.
          #
          # (UNQUOTED substitution of matrix.pattern is deliberate, exactly as in the run
          # step below: quoting it collapses the pattern list into ONE argument and
          # silently degrades the shard to a single bad glob.)
          shard=""
          for pat in ${{ matrix.pattern }}; do
            for g in test/$pat.sh $pat.sh; do
              [ -f "$g" ] || continue
              case " $shard " in *" $g "*) ;; *) shard="$shard $g" ;; esac
            done
          done
          if [ -z "$shard" ]; then
            echo "::error::shard '${{ matrix.name }}' pattern matched NO gates at all. A gate was renamed or deleted; this shard would have reported green having run nothing."
            exit 1
          fi

          if [ "$DOCS_ONLY" = "true" ]; then
            run=""
            why="docs-only change — nothing in this shard applies"
          elif [ "$NARROW" = "true" ]; then
            # Intersect this shard's gates with the set `detect` derived from the diff.
            run=""
            for g in $shard; do
              case " $DERIVED " in *" $g "*) run="$run $g" ;; esac
            done
            why="pull_request — narrowed to the gates this diff touches (merge_group runs ALL of them)"
          else
            run="$shard"
            why="FULL suite (event: ${{ github.event_name }})"
          fi

          skipped=""
          for g in $shard; do
            case " $run " in *" $g "*) ;; *) skipped="$skipped $g" ;; esac
          done

          echo "── shard '${{ matrix.name }}': $why"
          echo "── WILL RUN ($(printf '%s\n' $run | grep -c .) of $(printf '%s\n' $shard | grep -c .) gates in this shard):"
          for g in $run; do echo "     $g"; done
          echo "── WILL NOT RUN ($(printf '%s\n' $skipped | grep -c .) gates):"
          for g in $skipped; do echo "     $g"; done

          # run_gates.sh / build_oracles.sh --for take PATTERNS; a concrete gate path minus
          # its `.sh`, minus a leading `test/`, IS one ('diff_compiler_fmt',
          # 'native_fixtures/run', 'sqlite/test/select_oracle'). Same names the shards use.
          pats=""
          for g in $run; do p="${g%.sh}"; pats="$pats ${p#test/}"; done
          pats="${pats# }"

          if [ -z "$pats" ]; then
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo
            echo "▶ gates (${{ matrix.name }}) — no gates for this diff (runs FULL in merge_group). Reporting SUCCESS — the check still reports, which is what keeps the PR mergeable."

            # Make the no-op VISIBLE where humans/agents actually look, not just in a
            # log nobody opens for a green check: a "gates (X) — pass" check is, by
            # text alone, indistinguishable from a shard that ran every gate and
            # passed, and that ambiguity has misled a reviewer before (#450, #570).
            # Conclusion and context stay untouched (changing either touches the
            # merge queue's required-status-check contract); what moves is the
            # WORDING at the annotation title and job summary. Incident: dossier `ci.md`.
            echo "::warning title=gates (${{ matrix.name }}) — no gates for this diff (runs FULL in merge_group)::gates (${{ matrix.name }}) matched no gate for this diff and reported SUCCESS WITHOUT RUNNING. Real coverage for these gates runs in the merge queue (merge_group), not on this PR. 'green' here does NOT mean these gates ran."
            {
              echo "### gates (${{ matrix.name }}) — no gates for this diff (runs FULL in merge_group)"
              echo
              echo "This shard's pattern matched no gate touched by this diff, so it reported"
              echo "SUCCESS having run nothing (by design — see \`ci.yml\` around the \`plan\`"
              echo "step). Real coverage for this shard's gates runs when this PR enters the"
              echo "merge queue (\`merge_group\` event), where every shard runs its FULL pattern"
              echo "unconditionally. Treat this check's green as \"did not block\", not \"ran and"
              echo "passed\"."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_work=true" >> "$GITHUB_OUTPUT"
            echo "pats=$pats" >> "$GITHUB_OUTPUT"
          fi

      # sqlite3 is the ORACLE for the 22 `sqlite/test/*oracle.sh` gates — named
      # EXPLICITLY (an oracle a gate silently depends on and the workflow never
      # mentions is how "this didn't run" starts looking like "this passed").
      # Installed on EVERY shard, not just `sqlite`, so a gate moved between
      # shards for cost reasons can never silently lose its oracle. Also the wasm
      # arm of the 3-engine differential (#597, `engines` shard only) — the peer
      # of the `wasm:` job's own call to this action, same toolchain pin. The
      # BINARY is downloaded from `build` (#1928); the toolchain install stays,
      # since clang still compiles this shard's oracles.
      - name: Setup medaka (toolchain + wasm arm + downloaded binary)
        if: steps.plan.outputs.has_work == 'true'
        uses: ./.github/actions/setup-medaka
        with:
          sqlite: 'true'
          wasm: ${{ matrix.wasm_arm != '' }}
          binary: artifact

      # This shard's oracle set, keyed on the compiler/build-script inputs PLUS
      # the shard's own `pattern` (which oracles get built is DERIVED from the
      # pattern, so a pattern change without the key changing would restore a
      # `test/bin` missing the newly-needed oracles) PLUS `detect`'s `oracle_key`
      # (a narrowed pull_request builds a different, smaller `test/bin` than a
      # full run under what would otherwise be an identical key). The whole of
      # `ci.yml` is hashed rather than just the pattern string, since Actions has
      # no hash-a-string function and a pattern contains characters illegal in a
      # cache key — a comment-only edit therefore also busts the oracle cache,
      # deliberately the safe direction to be wrong in. A collision would fail
      # loudly (run_gates.sh reclassifies a missing oracle as a phantom-skip
      # FAILURE, never a SKIP), never silently. History: dossier `ci.md`.
      - name: Restore cached oracles for this shard
        id: oracle-cache
        if: steps.plan.outputs.has_work == 'true'
        uses: actions/cache@v4
        with:
          path: test/bin
          key: oracles-${{ matrix.name }}-v3-${{ hashFiles('compiler/**', 'stdlib/**', 'runtime/**', 'test/build_native_medaka.sh', 'test/bootstrap_from_seed.sh', 'test/build_oracles.sh', 'Makefile') }}-${{ hashFiles('.github/workflows/ci.yml', '.github/actions/**') }}-${{ needs.detect.outputs.oracle_key }}

      # Only the oracles THIS shard's gates actually read. See the header.
      # Skipped only on an exact cache hit above — a miss always rebuilds with
      # FORCE=1, so a restored oracle is never trusted on mtime alone (a cache
      # restore sets mtimes to extraction time, not original-build time, which
      # would otherwise defeat build_oracles.sh's own staleness check).
      - name: Build the oracles this shard needs
        if: steps.plan.outputs.has_work == 'true' && steps.oracle-cache.outputs.cache-hit != 'true'
        run: FORCE=1 sh test/build_oracles.sh --for ${{ steps.plan.outputs.pats }}

      # build_oracles.sh does not build the wasm emitter oracles (#597) — this
      # shard builds them separately. `--modules-only`: diff_compiler_engines
      # reads exactly one of the three wasm oracles, so building all three here
      # would over-buy; the `wasm:` job's seven gates open all three and build
      # accordingly. Not cached — a pure function of the compiler graph, which
      # the medaka cache above already keys.
      - name: Build the wasm emitter oracle (wasm arm)
        if: steps.plan.outputs.has_work == 'true' && matrix.wasm_arm != ''
        run: |
          export MEDAKA_EMITTER="$PWD/medaka_emitter"
          sh test/wasm/build_wasm_oracle.sh --modules-only

      # Runs the CONCRETE gate list `plan` resolved (never a glob) — the shard's
      # whole pattern on merge_group/push, the diff intersection on a narrowed
      # pull_request. Reclassifies a missing-oracle exit-2 as a FAILURE, not a
      # SKIP, so a shard that ran nothing can never report green. (UNQUOTED
      # substitution is deliberate — quoting would collapse the gate list into
      # ONE argument and silently degrade the shard to a single bad glob.)
      #
      # `full_cores` gives `engines` the whole runner instead of its own
      # ENGINE_JOBS=NCPU/2 hedge (derived from `nproc`, so it tracks runner
      # size). `wasm_arm` sets MEDAKA_REQUIRE_WASM=1 — the shard already
      # installed wasm-tools/Node and built the wasm oracle, so a missing wasm
      # arm here is a WIRING BREAK (exit 1), never the gate's honest elsewhere
      # degradation (exit 2, T2/T3 "NOT RUN"). See diff_compiler_engines.sh.
      - name: Gate shard — ${{ matrix.name }}
        if: steps.plan.outputs.has_work == 'true'
        run: |
          if [ -n "${{ matrix.full_cores }}" ]; then
            export ENGINE_JOBS="$(nproc)"
            echo "engines shard owns this runner: ENGINE_JOBS=$ENGINE_JOBS"
          fi
          # This shard installed wasm-tools + Node and built the wasm oracle above, so an
          # unavailable wasm arm here is a WIRING BREAK, not a dev box without a toolchain.
          # The gate's honest degradation (T2/T3 "NOT RUN") stays the default everywhere
          # else; here it becomes exit 1. See diff_compiler_engines.sh's MEDAKA_REQUIRE_WASM
          # block for why it must be exit 1 and never exit 2 (#597).
          if [ -n "${{ matrix.wasm_arm }}" ]; then
            export MEDAKA_REQUIRE_WASM=1
            echo "${{ matrix.name }} shard: MEDAKA_REQUIRE_WASM=1 — the wasm arm is mandatory here"
          fi
          sh test/run_gates.sh ${{ steps.plan.outputs.pats }}

      # THE REVIEW GATE — must be in THIS job, on the tree the gates just ran over.
      # Roc's model: regeneration is the default action and `git diff --exit-code`
      # forces every regenerated byte into review, which is what makes a
      # frictionless `--bless` safe. Today it catches gates that write into the
      # tree; after the snapshot migration lands `medaka snapshot --bless`, it
      # becomes the real guard. Skipped on a docs-only run: nothing above ran.
      - name: The tree must not have drifted
        if: steps.plan.outputs.has_work == 'true'
        run: |
          if ! git diff --exit-code; then
            echo "::error::A gate in the '${{ matrix.name }}' shard modified tracked files."
            echo "::error::Commit them deliberately, or fix the gate that writes into the tree."
            exit 1
          fi
          untracked="$(git status --porcelain --untracked-files=normal | grep -v '^!!' || true)"
          if [ -n "$untracked" ]; then
            echo "::error::A gate in the '${{ matrix.name }}' shard left untracked files behind:"
            echo "$untracked"
            exit 1
          fi

  # ── The trust anchor ─────────────────────────────────────────────────────────
  # `make medaka` asks "CAN I build from the seed?"; `seed-health` asks "does the
  # seed still WORK, and how far has it DRIFTED?" — different questions, and only
  # the second was gated until 2026-07-13 (dossier `ci.md`). Policy: the seed
  # only has to WORK. Byte-currency (C3a) is a drift detector, not a
  # requirement — demanding it forced a costly re-mint history before the
  # policy was fixed (dossier `ci.md`). So drift WARNS and a broken seed FAILS.
  # Re-mint at checkpoints (`make bootstrap` is strict).
  #
  # ── Compiler soundness: two gates documented but never enforced (until a10c2705) ──
  # `typecheck` asks "is the compiler source well-typed?" (the build does not
  # ask). `fixpoint` asks "does the emitter reproduce itself?" (C3a/C3b
  # byte-identical). `gates` runs the compiler; it never typechecks it.
  # `seed-health` proves the seed works; it never proves the source is
  # well-typed or that emission reached a fixpoint. Incident: dossier `ci.md`.
  soundness:
    # `build` for the binaries (#1928); `detect` for its outputs. The `if:` is the
    # same guard, for the same reason, as the one on `gates` above — read it there.
    needs: [detect, build]
    if: ${{ always() && needs.detect.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # ── DELIBERATELY UNGUARDED: every doc-gate step below runs even when
      # docs_only=true. Guarding a doc gate on docs_only would skip it on
      # precisely the PRs it exists to police. Each needs no compiler (pure
      # text analysis), so each is nearly free to always run. Lives in
      # `soundness` because that job already answers "is the tree coherent?"
      # and is already a required check.
      - name: Docs must not cite dead paths
        run: sh test/check_doc_links.sh

      # Also unguarded, and for the same reason — and this one needs it most. The
      # sibling gate above checks that a doc's cited PATHS exist; this one checks that
      # its cited SYMBOLS do. A repo-wide review found ~44 false concrete claims in the
      # .claude/skills/*/SKILL.md playbooks agents EXECUTE (a `pushTypeError` taught at
      # the wrong arity, a `Show` typeclass that never existed, a 20-name "grep these"
      # index that was 19/20 fictional) — and ~30 were the same mechanical shape: a
      # backticked symbol resolving nowhere in source. Doc rot lands in prose-only PRs,
      # so guarding this on docs_only would skip it on exactly the PRs it must police.
      # Pure text analysis, no compiler.
      - name: Docs must not cite fabricated symbols
        run: sh test/check_agent_doc_symbols.sh

      # Also unguarded, same reason, one layer down each time: PATHS exist (above)
      # -> SYMBOLS resolve (above) -> CLAUSE LABELS have a definition (this gate)
      # -> gate scripts don't PRESCRIBE a dangerous command (next gate). Each
      # closed a real, silent, multi-week rot with the same shape — pure text
      # analysis, no compiler. Incident history: dossier `ci.md`.
      - name: Spec clause citations must resolve to a same-document definition
        run: sh test/check_spec_clause_labels.sh

      - name: No script may prescribe the bare build_oracles.sh
        run: sh test/check_no_banned_oracle_cmd.sh

      # A Bash launcher that re-enters itself through `sh "$0"` changes the
      # interpreter under its own feet. It may pass the outer setup and then
      # fail on Bash syntax deep in a worker path, wasting an entire gate turn.
      # Pure text analysis with fail-capable controls; keep it unguarded.
      - name: Bash scripts must preserve their interpreter when self-invoking
        run: sh test/check_recursive_shell_interpreter.sh

      - name: Mutation transactions must restore on red and interruption
        run: sh test/check_mutation_transaction.sh

      # Also unguarded, same reason (#1451): the lexer's reserved-word list is
      # hand-duplicated into the vscode grammar and the playground tokenizer,
      # with nothing diffing them against it. Pure text analysis, no compiler.
      - name: Editor keyword lists must stay in sync with the lexer
        run: sh test/check_keyword_sync.sh

      # Also unguarded, same reason. docs/README.md is GENERATED from the docs'
      # `**Status:**` banners because a hand-maintained index rots — regenerate
      # here and fail if it differs, or the generator is just a suggestion.
      - name: Docs index must be regenerated, not hand-edited
        run: |
          sh test/gen_docs_index.sh
          if ! git diff --exit-code -- docs/README.md; then
            echo "::error::docs/README.md is stale. Run 'make docs-index' and commit the result."
            exit 1
          fi

      # Toolchain still needed (clang builds the typecheck oracle; the fixpoint
      # gate cold-bootstraps from the seed on its own); the BINARY comes from
      # `build` (#1928).
      - name: Setup medaka (toolchain + downloaded binary)
        if: needs.detect.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-medaka
        with:
          binary: artifact

      # ── Fingerprint mirror parity (#267, PR #263) ───────────────────────────
      # `test/build_native_medaka.sh` and `compiler/driver/medaka_cli.mdk` are
      # two hand-synced reimplementations of the same source-fingerprint hash;
      # #182 broke the mirror once and only human review caught it, no gate
      # proved the two agreed. This one does — see dossier `ci.md`.
      - name: Fingerprint mirror must still agree (issue #267)
        if: needs.detect.outputs.docs_only != 'true'
        run: sh test/check_fingerprint_parity.sh

      # `typecheck_compiler_source.sh` exits 2 (SKIP) when its oracle is absent,
      # indistinguishable from a pass in CI — so build the oracle first and
      # assert on the PASS line, not the exit status.
      - name: Build the typecheck oracle
        if: needs.detect.outputs.docs_only != 'true'
        run: FORCE=1 sh test/build_oracles.sh --build-one diagnostics_project_main

      # ── The MUST-FAIL suite: the tracker's self-drain (#547) ────────────────
      # Every fixture asserts an OPEN issue's bug still reproduces; a fix landing
      # turns this RED, and the message says to close the issue.
      # ⚠️ LIVES HERE, NOT IN A GATE SHARD, and that is load-bearing: shards are
      # narrowed on `pull_request`, and no hand-maintained bug-to-file map could
      # derive this gate from a diff without rotting on the first new fixture.
      # `soundness` runs FULL on every event and is already required. Guarded on
      # docs_only, correctly here — this needs the compiler. History: dossier `ci.md`.
      - name: Open bugs must still reproduce (must-fail suite — a RED here means someone FIXED something)
        if: needs.detect.outputs.docs_only != 'true'
        run: sh test/diff_compiler_must_fail.sh

      # `selfcompile_fixpoint.sh` asserts C3a AND C3b, the right bar for a
      # checkpoint re-mint but the wrong bar for CI: C3b (the compiled compiler
      # reproduces its own output) is soundness and must hard fail; C3a (the
      # seed is byte-current) is a drift detector and must only warn — blocking
      # on it would turn CI red on every emitter change. Assert on the verdict
      # lines below, never the script's raw exit status (`| tee` would mask it
      # anyway). Typecheck and fixpoint run overlapped (independent, read-only,
      # separate scratch paths) but the must-fail suite above is EXCLUDED from
      # that overlap — its fixtures carry fail-capable timing alarms that CPU
      # contention has already flipped from a real failure into a false
      # timeout. History: dossier `ci.md`.
      - name: Compiler source is well-typed and emitter reproduces itself
        if: needs.detect.outputs.docs_only != 'true'
        run: |
          set +e
          JOBS=3 bash test/typecheck_compiler_source.sh > /tmp/tc.log 2>&1 &
          typecheck_pid=$!
          bash test/selfcompile_fixpoint.sh > /tmp/fp.log 2>&1 &
          fixpoint_pid=$!

          wait "$typecheck_pid"
          typecheck_rc=$?
          echo "::group::Compiler source typecheck"
          cat /tmp/tc.log
          echo "::endgroup::"

          wait "$fixpoint_pid"
          echo "::group::Self-compile fixpoint"
          cat /tmp/fp.log
          echo "::endgroup::"
          set -e

          failed=0
          if [ "$typecheck_rc" -ne 0 ] || ! grep -q 'PASS: compiler source is type-clean' /tmp/tc.log; then
            echo "::error::The compiler source is ILL-TYPED (or the gate skipped). The build does not gate on this — that is why the gate exists."
            failed=1
          fi
          # A skip is not a pass. We just installed clang+libgc, so a toolchain skip here
          # means something is wrong, not absent.
          if grep -q 'skipping spike' /tmp/fp.log; then
            echo "::error::The fixpoint gate SKIPPED on a runner with a full toolchain. A skip is not a pass."
            failed=1
          fi
          if ! grep -q 'C3b PASS' /tmp/fp.log; then
            echo "::error::NO FIXPOINT: the compiled compiler does not reproduce its own output (C3b). This is a miscompile in the emitter."
            failed=1
          fi
          if grep -q 'C3a FAIL' /tmp/fp.log; then
            echo "::warning::Seed has DRIFTED from current emission (it still works, and the compiler still reaches a fixpoint). Re-mint at the next checkpoint: sh test/refresh_seed.sh"
          fi
          exit "$failed"

  seed-health:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Setup medaka (toolchain only)
        if: needs.detect.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-medaka
      - name: Seed must still build a working emitter (drift only warns)
        if: needs.detect.outputs.docs_only != 'true'
        run: |
          sh test/bootstrap_from_seed.sh 2>&1 | tee /tmp/seed.log
          # A seed that cannot do its job is a HARD failure — the script exits
          # nonzero for that, and `set -e`-less `tee` would hide it, so check.
          if ! grep -q 'BOOTSTRAP-FROM-SEED PASS' /tmp/seed.log; then
            echo "::error::The seed can no longer build a working emitter. Re-mint: sh test/refresh_seed.sh"
            exit 1
          fi
          # Drift is informative, not actionable-right-now. Surface it, don't block.
          if grep -q 'C3a WARN' /tmp/seed.log; then
            echo "::warning::Seed has DRIFTED from current emission (still works). Re-mint at the next checkpoint: sh test/refresh_seed.sh"
          fi

  # ── The in-language suite: doctests, properties, `test "..."` decls ───────────
  inlang:
    # `build` for the binaries (#1928); `if:` guard as on `gates` above.
    needs: [detect, build]
    if: ${{ always() && needs.detect.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup medaka (toolchain + downloaded binary)
        if: needs.detect.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-medaka
        with:
          binary: artifact
      # ⚠️ THE ONE CONSUMER JOB THAT RUNS `make`. `make test` depends on the `.PHONY`
      # `medaka` target, so it re-enters test/build_native_medaka.sh, whose stage B
      # (the clang link of ./medaka, ~55 s) is otherwise unconditional — it would
      # overwrite the binary this job just downloaded and eat the whole #1928 win for
      # this job. SKIP_CLI_LINK_IF_FRESH=1 makes stage B honour `.medaka.srcstamp`
      # (which travels with the artifact, same-SHA invariant as the emitter stamp) and
      # skip the relink. Stage A already skips via `.medaka_emitter.srcstamp`.
      # Deliberately scoped to THIS step: the flag is default-off everywhere else, so
      # the local dev loop and every other caller relink exactly as before.
      - name: Doctests, properties, and test decls
        if: needs.detect.outputs.docs_only != 'true'
        env:
          SKIP_CLI_LINK_IF_FRESH: '1'
        run: make test

  # ── T25: the WasmGC backend gates ─────────────────────────────────────────────
  # WasmGC is one of Medaka's TWO production backends and the engine the
  # playground runs on, yet its gates ran in NO CI job until T25 — a stock
  # runner lacks the toolchain and the gates SKIP (exit 2) when it's absent, so
  # nothing was watching, and two silent wasm miscompiles reached main that way.
  # History: dossier `ci.md`.
  #
  # ONE job, not six more gate shards: only these gates need the wasm toolchain,
  # and adding it to every `gates` shard would tax all seven for a tool one job
  # needs. These seven gates are NOT sharded (no matrix `pattern:`) — each is
  # invoked by its LITERAL repo-relative path below, the coverage gate's "named
  # gate" mechanism (same as `soundness`'s fixpoint + typecheck gates).
  #
  # ⚠️ NEVER job-level `if:` — same required-context deadlock risk as every
  # other heavy job; only STEPS are gated on `docs_only`. Runs on every
  # non-docs event, NOT narrowed (these seven ARE the whole wasm surface and are
  # cheap enough to run in full).
  #
  # A REQUIRED CHECK, in a repository RULESET (not classic branch protection —
  # the classic endpoint 404s "Branch not protected", which reads exactly like
  # "nothing is required" and is how an earlier version of this note rotted).
  # Derive live, never trust a date in this file:
  #   gh api repos/MedakaLang/medaka/rulesets --jq '.[]|{id,name,enforcement}'
  #   gh api repos/MedakaLang/medaka/rulesets/<id> \
  #     --jq '.rules[]|select(.type=="required_status_checks")
  #            |.parameters.required_status_checks[].context'
  wasm:
    # `build` for the binaries (#1928); `if:` guard as on `gates` above.
    needs: [detect, build]
    if: ${{ always() && needs.detect.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # wasm-tools/Node versions come from setup-medaka's own input defaults — shared
    # verbatim with the `engines` gate shard's call to the same action, which installs
    # the same toolchain for the 3-engine differential's T2/T3 arms (#597). Do not
    # override either here; that is precisely the drift the single source prevents.
    steps:
      - uses: actions/checkout@v4

      # node >= 22 is required for the finalized WasmGC 3.0 GC encoding these gates emit
      # (test/wasm/run.js). ubuntu-latest ships an older node, so this pins 24 (the dev
      # box's). wasm-tools (parse + validate the emitted WAT) is NOT on a stock runner
      # either — the pinned prebuilt release is downloaded and extracted OUTSIDE the
      # checkout (see the action for why).
      - name: Setup medaka (toolchain + wasm + downloaded binary)
        if: needs.detect.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-medaka
        with:
          wasm: 'true'
          binary: artifact

      # The three WasmGC emitter oracle binaries (wasm_emit_main / _typed_ / _modules_)
      # that these gates drive. Cheap; deliberately NOT cached (they are a pure
      # function of the whole compiler graph, which the medaka cache above already keys).
      - name: Build the wasm emitter oracles
        if: needs.detect.outputs.docs_only != 'true'
        run: |
          export MEDAKA_EMITTER="$PWD/medaka_emitter"
          sh test/wasm/build_wasm_oracle.sh

      # The gates, each invoked by its LITERAL repo-relative path — that literal is
      # what makes diff_compiler_ci_shard_coverage.sh classify them "covered" (see the
      # COVERAGE note above). Run DIRECTLY, not via run_gates.sh: a direct exit 2 (a
      # toolchain skip) then FAILS the job instead of being reclassified as a skip — and
      # "a skip is not a pass" is the entire reason this gate coverage hole existed. All
      # all run (|| rc=1) before the job fails, so one red gate never hides the others.
      - name: WasmGC backend gates
        if: needs.detect.outputs.docs_only != 'true'
        run: |
          set -u
          export MEDAKA_EMITTER="$PWD/medaka_emitter"
          export MEDAKA_WASM_EMITTER="$PWD/test/bin/wasm_emit_modules_main"
          rc=0
          bash test/wasm/diff_wasm.sh          || rc=1
          bash test/wasm/diff_wasm_typed.sh    || rc=1
          bash test/wasm/diff_playground_input.sh || rc=1
          bash test/wasm/diff_wasm_modules.sh  || rc=1
          bash test/wasm/diff_sqlite.sh        || rc=1
          bash test/wasm/diff_gzip.sh          || rc=1
          bash test/build_wasm_cmd.sh          || rc=1
          exit $rc
