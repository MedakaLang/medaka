            #
            # The row NAME is a required status-check context (`gates_3`), so renaming it
            # is a ruleset change, not an edit here. It is a bare executor number by
            # construction (#2178): a name that cannot describe contents cannot lie
            # about them. What failed is reported by AREA, from the registry.
            pattern: "'gzip/test/inflate_oracle' 'pds/test/constant_time_signing' 'pds/test/ecdsa_vectors' 'pds/test/encodings_vectors' 'pds/test/lexjson_vectors' 'pds/test/scalar_vectors' 'sqlite/test/delete_negative_oracle' 'sqlite/test/groupby_oracle' 'sqlite/test/oracle' 'sqlite/test/update_expr_oracle' 'sqlite/test/update_oracle' 'bootstrap_lex' 'build_construct_coverage' 'diff_compiler_check_json' 'diff_compiler_check' 'diff_compiler_check_wrapper_callers' 'diff_compiler_core_ir_prelude' 'diff_compiler_core_ir' 'diff_compiler_stdlib_conventions' 'diff_compiler_effect_hole' 'diff_compiler_eval_run' 'diff_compiler_exhaust' 'diff_compiler_flat_vs_onemodule' 'diff_compiler_index_oob' 'diff_compiler_index' 'diff_compiler_ir_scaling' 'diff_compiler_preflight_base' 'diff_compiler_references_scaling' 'diff_compiler_resolve_batch' 'diff_compiler_run_stdout_flush' 'diff_compiler_snapshot_eval_errors' 'diff_compiler_stack_overflow' 'diff_compiler_test' 'effect_builtin_param_domain' 'selfcompile_build_fixpoint' 'diff_compiler_guide_render'"
            wasm_arm: "1"
          - name: gates_4
            # ROW IDENTITY, NOT PLACEMENT. Which gates run here is DERIVED
            # (`medaka gate balance`, #2178) from test/gate_cost_baseline.json and
            # regenerated into this matrix by `make gen-ci`; it changes whenever the
            # baseline does, so nothing below names a gate. What this row is:
            #
            # full_cores = false, wasm_arm = false -> an ordinary shared runner with
            # no extra toolchain, fully open to the packer. It can take any gate that
            # does not require the Wasm toolchain, and the balancer fills it to the
            # same target load as every other open row.
            #
            # The row NAME is a required status-check context (`gates_4`), so renaming it
            # is a ruleset change, not an edit here. It is a bare executor number by
            # construction (#2178): a name that cannot describe contents cannot lie
            # about them. What failed is reported by AREA, from the registry.
            pattern: "'pds/test/inlang_test_oracle'"
          - name: gates_5
            # ROW IDENTITY, NOT PLACEMENT. Which gates run here is DERIVED
            # (`medaka gate balance`, #2178) from test/gate_cost_baseline.json and
            # regenerated into this matrix by `make gen-ci`; it changes whenever the
            # baseline does, so nothing below names a gate. What this row is:
            #
            # full_cores = false, wasm_arm = false -> an ordinary shared runner with
            # no extra toolchain, fully open to the packer. It can take any gate that
            # does not require the Wasm toolchain, and the balancer fills it to the
            # same target load as every other open row.
            #
            # The row NAME is a required status-check context (`gates_5`), so renaming it
            # is a ruleset change, not an edit here. It is a bare executor number by
            # construction (#2178): a name that cannot describe contents cannot lie
            # about them. What failed is reported by AREA, from the registry.
            pattern: "'diff_compiler_stage_ir_scaling'"
          - name: gates_6
            # ROW IDENTITY, NOT PLACEMENT. Which gates run here is DERIVED
            # (`medaka gate balance`, #2178) from test/gate_cost_baseline.json and
            # regenerated into this matrix by `make gen-ci`; it changes whenever the
            # baseline does, so nothing below names a gate. What this row is:
            #
            # full_cores = false, wasm_arm = false -> an ordinary shared runner with
            # no extra toolchain, fully open to the packer. It can take any gate that
            # does not require the Wasm toolchain, and the balancer fills it to the
            # same target load as every other open row.
            #
            # The row NAME is a required status-check context (`gates_6`), so renaming it
            # is a ruleset change, not an edit here. It is a bare executor number by
            # construction (#2178): a name that cannot describe contents cannot lie
            # about them. What failed is reported by AREA, from the registry.
            pattern: "'build_cmd' 'sqlite/test/select_oracle' 'pds/test/constant_time_public_key' 'pds/test/rfc6979_vectors' 'pds/test/sha256_vectors' 'pds/test/signing_corpus' 'sqlite/test/delete_oracle' 'sqlite/test/dml_oracle' 'sqlite/test/index_write_oracle' 'sqlite/test/inlang_test_oracle' 'sqlite/test/join_oracle' 'sqlite/test/sql_oracle' 'sqlite/test/writer_api_oracle' 'bootstrap_eval' 'diff_compiler_build' 'diff_compiler_capability_matrix' 'diff_compiler_check_batch' 'diff_compiler_check_cli_modules' 'diff_compiler_codemod' 'diff_compiler_core_ir_roundtrip' 'diff_compiler_core_ir_typed_modules' 'diff_compiler_core_ir_typed' 'diff_compiler_diagnostics' 'diff_compiler_eval_list' 'diff_compiler_eval' 'diff_compiler_eval_typed_batch' 'diff_compiler_fixture_corpus_coverage' 'diff_compiler_let_refute' 'diff_compiler_llvm_ffi' 'diff_compiler_llvm_modules' 'diff_compiler_llvm_typed_ir' 'diff_compiler_new' 'diff_compiler_os_entropy' 'diff_compiler_parse_error_loc' 'diff_compiler_perf_scaling' 'diff_compiler_prelude_obj' 'diff_compiler_references_correctness' 'diff_compiler_selfproc' 'diff_compiler_snapshot_core_ir' 'diff_compiler_snapshot_types_user' 'diff_compiler_snapshot_wasm_input' 'diff_compiler_source_bytes' 'diff_compiler_test_typecheck' 'diff_native_cli' 'diff_native_stack' 'pr_helper_test' 'selfcompile_emit' 'selfcompile_lex' 'diff_compiler_gate_registry' 'diff_compiler_check_ir_floor' 'diff_compiler_cli_help_conformance'"
          - name: gates_7
            # ROW IDENTITY, NOT PLACEMENT. Which gates run here is DERIVED
            # (`medaka gate balance`, #2178) from test/gate_cost_baseline.json and
            # regenerated into this matrix by `make gen-ci`; it changes whenever the
            # baseline does, so nothing below names a gate. What this row is:
            #
            # full_cores = false, wasm_arm = false -> an ordinary shared runner with
            # no extra toolchain, fully open to the packer. It can take any gate that
            # does not require the Wasm toolchain, and the balancer fills it to the
            # same target load as every other open row.
            #
            # The row NAME is a required status-check context (`gates_7`), so renaming it
            # is a ruleset change, not an edit here. It is a bare executor number by
            # construction (#2178): a name that cannot describe contents cannot lie
            # about them. What failed is reported by AREA, from the registry.
            pattern: "'diff_compiler_ci_shard_coverage' 'diff_compiler_prose_classifier' 'mq/test/check' 'parsec/test/check' 'pds/test/field_vectors' 'pds/test/secp256k1_point_vectors' 'pds/test/secp256k1_public_key' 'pds/test/trust_boundary_guards' 'sqlite/test/distinct_oracle' 'sqlite/test/multipage_oracle' 'sqlite/test/overflow_oracle' 'sqlite/test/projection_oracle' 'sqlite/test/typed_oracle' 'bootstrap_resolve' 'bootstrap_typecheck' 'check_build_oracles_for_consistency' 'check_syntax_examples' 'diff_compiler_analyze_project' 'diff_compiler_call_arity' 'diff_compiler_check_match' 'diff_compiler_check_policy' 'diff_compiler_core_ir_modules' 'diff_compiler_dispatch_shape' 'diff_compiler_doc' 'diff_compiler_doc_stdlib_reference' 'diff_compiler_draft_semantic' 'diff_compiler_effect_param' 'diff_compiler_effect_polarity' 'diff_compiler_eval_dict_batch' 'diff_compiler_eval_json' 'diff_compiler_eval_prelude_batch' 'diff_compiler_fmt_roundtrip' 'diff_compiler_fmt' 'diff_compiler_fmt_write_safety' 'diff_compiler_lex_files' 'diff_compiler_lint_cache' 'diff_compiler_lint_fix' 'diff_compiler_lint_multi_dir' 'diff_compiler_llvm_typed' 'diff_compiler_lsp_b3' 'diff_compiler_lsp_b4' 'diff_compiler_lsp' 'diff_compiler_parse_errors' 'diff_compiler_ported' 'diff_compiler_reach_fail_open' 'diff_compiler_references_tool' 'diff_compiler_repl' 'diff_compiler_rt_obj' 'diff_compiler_snapshot_eval' 'diff_compiler_tmc_parity' 'diff_compiler_tier_drift'"
          - name: gates_8
            # ROW IDENTITY, NOT PLACEMENT. Which gates run here is DERIVED
            # (`medaka gate balance`, #2178) from test/gate_cost_baseline.json and
            # regenerated into this matrix by `make gen-ci`; it changes whenever the
            # baseline does, so nothing below names a gate. What this row is:
            #
            # wasm_arm = true  -> installs wasm-tools + Node and builds the Wasm
            # oracle (`sh test/wasm/build_wasm_oracle.sh --modules-only`). This is one
            # of only two OPEN rows that carry it (the other is `gates_3`), so it is one
            # of only two rows a wasm-constrained gate can legally land on — the
            # balancer treats that as a hard constraint, never as a cost.
            #
            # full_cores = false: an ordinary shared runner, open to the packer.
            #
            # The row NAME is a required status-check context (`gates_8`), so renaming it
            # is a ruleset change, not an edit here. It is a bare executor number by
            # construction (#2178): a name that cannot describe contents cannot lie
            # about them. What failed is reported by AREA, from the registry.
            pattern: "'diff_compiler_parse_result' 'diff_compiler_eval_modules' 'byteparser/test/check' 'pds/test/atsyntax_vectors' 'pds/test/car_vectors' 'pds/test/constant_time_parity' 'pds/test/constant_time_reductions' 'pds/test/dagcbor_cid_vectors' 'pds/test/did_key_all_engines' 'pds/test/mst_vectors' 'pds/test/repo_vectors' 'sqlite/test/multipage_write_oracle' 'sqlite/test/multitable_write_oracle' 'sqlite/test/rowid_roundtrip_oracle' 'cross_project_twonames' 'diff_compiler_anf_identity' 'diff_compiler_check_modules' 'diff_compiler_ci_guard_failsafe' 'diff_compiler_core_ir_list' 'diff_compiler_entry_exit_codes' 'diff_compiler_eval_list_batch' 'diff_compiler_eval_prelude' 'diff_compiler_eval_run_batch' 'diff_compiler_eval_scaling' 'diff_compiler_lint_crossfile' 'diff_compiler_lint_multi' 'diff_compiler_llvm' 'diff_compiler_mcp' 'diff_compiler_origin_agreement' 'diff_compiler_perf_stage_census' 'diff_compiler_resolve_modules' 'diff_compiler_resolve' 'diff_compiler_run_check_agreement' 'diff_compiler_run_entry_subdir' 'diff_compiler_snapshot_bless' 'diff_compiler_snapshot_prelude' 'diff_compiler_snapshot_types' 'diff_compiler_typecheck_errors' 'diff_compiler_wasm_shim_parity' 'diff_net' 'effect_set_domain' 'manifest_emit' 'native_fixtures/run' 'diff_compiler_cli_reject_floor'"
            wasm_arm: "1"
          # GENERATED:END gates-matrix
    # The job name IS the required status-check context. It is a bare executor
    # number (`gates_1`…`gates_8`), NOT a theme: which gates run here is derived
    # from measured cost (`medaka gate balance`, #2178), so any descriptive name
    # would be free to drift out of agreement with the contents and no gate could
    # catch it — `gates (sqlite)` held zero sqlite gates for months. Semantic
    # identity lives in the registry's `area` field, and the failure-reporting
    # step below is what surfaces it. Renaming a row is a RULESET change (a
    # required context no job produces deadlocks the queue), never an edit here
    # alone — see the alias jobs at the bottom of this file.
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      # ── WHAT DOES *THIS* SHARD ACTUALLY HAVE TO DO? ───────────────────────────────
      # ⚠️ THE STEPS BELOW ARE GUARDED; THE JOB IS NOT (except for cancellation) —
      # the required checks (derive them: `gh api …`, see the docs-only fast path
      # note above) carry ZERO approvals, and a job skipped by
      # a job-level `if:` (or a workflow skipped by `paths-ignore:`) never posts a
      # status, leaving the PR permanently unmergeable. So this job RUNS and
      # REPORTS on every outcome except the whole run being cancelled (the guard
      # above); only STEPS are conditional, same shape as the
      # docs-only fast path.
      #
      # Computes `has_work` (every expensive step below hangs off it) and `pats`
      # (the concrete gate list to run) — and prints BOTH the gates it will run and
      # every gate in the shard it will NOT, by name, on every run. A preflight
      # that quietly under-reports its own coverage is the exact failure this
      # suite exists to prevent.
      - name: Plan this shard
        id: plan
        env:
          DOCS_ONLY: ${{ needs.detect.outputs.docs_only }}
          NARROW: ${{ needs.detect.outputs.narrow }}
          DERIVED: ${{ needs.detect.outputs.gates }}
          EVENT: ${{ github.event_name }}
          # #2179 — `full`, or the space-separated projects this queue entry can
          # reach. See `detect`'s `reach` step and the file header.
          PROJECT_REACH: ${{ needs.detect.outputs.project_reach }}
        run: |
          set -u

          # Expand THIS shard's patterns into repo-relative gate paths, resolving against
          # BOTH `test/` and the repo root — the SAME rule run_gates.sh, build_oracles.sh
          # --for and diff_compiler_ci_shard_coverage.sh use. All four must agree, or CI
          # would certify coverage of a gate that silently never ran.
          #
          # (UNQUOTED substitution of matrix.pattern is deliberate, exactly as in the run
          # step below: quoting it collapses the pattern list into ONE argument and
          # silently degrades the shard to a single bad glob.)
          shard=""
          for pat in ${{ matrix.pattern }}; do
            for g in test/$pat.sh $pat.sh; do
              [ -f "$g" ] || continue
              case " $shard " in *" $g "*) ;; *) shard="$shard $g" ;; esac
            done
          done
          if [ -z "$shard" ]; then
            echo "::error::shard '${{ matrix.name }}' pattern matched NO gates at all. A gate was renamed or deleted; this shard would have reported green having run nothing."
            exit 1
          fi

          if [ "$DOCS_ONLY" = "true" ]; then
            run=""
            why="docs-only change — nothing in this shard applies"
          elif [ "$NARROW" = "true" ]; then
            # Intersect this shard's gates with the set `detect` derived from the diff.
            run=""
            for g in $shard; do
              case " $DERIVED " in *" $g "*) run="$run $g" ;; esac
            done
            why="pull_request — narrowed to the gates this diff touches (merge_group runs every COMPILER gate, and this shard's library-project gates only if the diff reaches them)"
          else
            run="$shard"
            why="FULL suite (event: $EVENT)"

            # ── #2179: the ONLY narrowing a merge_group run ever does. ──────────
            # It drops LIBRARY-PROJECT gates only. A gate is dropped iff all three
            # hold: the event is merge_group; `reach` derived a real project list
            # rather than `full`; and the gate's registry `project` resolves to a
            # name that is neither `compiler` nor in that list. Every other case —
            # including a gate whose project the registry cannot resolve — keeps
            # the gate. Failing open here is not a courtesy: a dropped gate is a
            # gate that reported green having never run, on the MERGED tree, which
            # is the one place this suite exists to be trusted.
            if [ "$EVENT" = "merge_group" ] && [ "$PROJECT_REACH" != "full" ] && [ -n "$PROJECT_REACH" ]; then
              # Same parse as `detect`'s `reach` step: `run =` is the repo-relative
              # gate path, which is the form `$shard` holds. Read from the registry
              # rather than inferred from the path, so a project gate that ever
              # moves out from under `<project>/test/` still resolves.
              awk '
                /^\[\[gate\]\]/     { if (r != "" && p != "") print r, p; r=""; p="" }
                /^run *= *"/        { r = $0; sub(/^run *= *"/, "", r); sub(/".*$/, "", r) }
                /^project *= *"/    { p = $0; sub(/^project *= *"/, "", p); sub(/".*$/, "", p) }
                END                 { if (r != "" && p != "") print r, p }
              ' test/gates.toml > "$RUNNER_TEMP/gate_projects.txt"

              kept=""
              for g in $run; do
                gp="$(awk -v g="$g" '$1==g{print $2; exit}' "$RUNNER_TEMP/gate_projects.txt")"
                if [ -z "$gp" ] || [ "$gp" = "compiler" ]; then
                  kept="$kept $g"
                  continue
                fi
                case " $PROJECT_REACH " in *" $gp "*) kept="$kept $g" ;; esac
              done
              run="$kept"
              why="merge_group — every COMPILER gate runs; library-project gates scoped to reachable projects ($PROJECT_REACH)"
            fi
          fi

          skipped=""
          for g in $shard; do
            case " $run " in *" $g "*) ;; *) skipped="$skipped $g" ;; esac
          done

          echo "── shard '${{ matrix.name }}': $why"
          echo "── WILL RUN ($(printf '%s\n' $run | grep -c .) of $(printf '%s\n' $shard | grep -c .) gates in this shard):"
          for g in $run; do echo "     $g"; done
          echo "── WILL NOT RUN ($(printf '%s\n' $skipped | grep -c .) gates):"
          for g in $skipped; do echo "     $g"; done

          # run_gates.sh / build_oracles.sh --for take PATTERNS; a concrete gate path minus
          # its `.sh`, minus a leading `test/`, IS one ('diff_compiler_fmt',
          # 'native_fixtures/run', 'sqlite/test/select_oracle'). Same names the shards use.
          pats=""
          for g in $run; do p="${g%.sh}"; pats="$pats ${p#test/}"; done
          pats="${pats# }"

          if [ -z "$pats" ]; then
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo

            # ⚠️ TWO different empties, and they are NOT interchangeable (#2179).
            # On `pull_request` the honest thing to say is "the merge queue will
            # run these"; on `merge_group` that sentence is a LIE — the queue IS
            # the run, and this shard's gates were scoped out of it because the
            # entry cannot reach their projects. Nothing downstream runs them.
            # Saying so is the whole reason this block exists.
            if [ "$EVENT" = "merge_group" ]; then
              headline="${{ matrix.name }} — every gate here belongs to a project this entry cannot reach"
              detail="${{ matrix.name }} reported SUCCESS WITHOUT RUNNING. Every gate in this shard is owned by a library project outside this entry's reach (${PROJECT_REACH}), so it was scoped out by #2179 and NOTHING downstream runs it. 'green' here does NOT mean these gates ran."
            else
              headline="${{ matrix.name }} — no gates for this diff (runs FULL in merge_group)"
              detail="${{ matrix.name }} matched no gate for this diff and reported SUCCESS WITHOUT RUNNING. Real coverage for these gates runs in the merge queue (merge_group), not on this PR. 'green' here does NOT mean these gates ran."
            fi

            echo "▶ $headline. Reporting SUCCESS — the check still reports, which is what keeps the PR mergeable."

            # Make the no-op VISIBLE where humans/agents actually look, not just in a
            # log nobody opens for a green check: a "gates_N — pass" check is, by
            # text alone, indistinguishable from a shard that ran every gate and
            # passed, and that ambiguity has misled a reviewer before (#450, #570).
            # Conclusion and context stay untouched (changing either touches the
            # merge queue's required-status-check contract); what moves is the
            # WORDING at the annotation title and job summary. Incident: dossier `ci.md`.
            echo "::warning title=${headline}::${detail}"
            {
              echo "### $headline"
              echo
              if [ "$EVENT" = "merge_group" ]; then
                echo "Every gate in this shard is owned by a library project that this queue"
                echo "entry's diff cannot reach (reach: \`${PROJECT_REACH}\`), so the shard reported"
                echo "SUCCESS having run nothing — by design, see \`ci.yml\`'s header and the"
                echo "\`reach\` step in \`detect\`. Unlike the \`pull_request\` case, there is no later"
                echo "run that covers these gates: the queue IS the run. Treat this check's green"
                echo "as \"out of reach\", not \"ran and passed\". The full COMPILER suite ran"
                echo "unconditionally on this same entry, in the other shards."
              else
                echo "This shard's pattern matched no gate touched by this diff, so it reported"
                echo "SUCCESS having run nothing (by design — see \`ci.yml\` around the \`plan\`"
                echo "step). Real coverage for this shard's gates runs when this PR enters the"
                echo "merge queue (\`merge_group\` event), where every compiler gate runs"
                echo "unconditionally. Treat this check's green as \"did not block\", not \"ran and"
                echo "passed\"."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "has_work=true" >> "$GITHUB_OUTPUT"
            echo "pats=$pats" >> "$GITHUB_OUTPUT"
          fi

      # sqlite3 is the ORACLE for the 22 `sqlite/test/*oracle.sh` gates — named
      # EXPLICITLY (an oracle a gate silently depends on and the workflow never
      # mentions is how "this didn't run" starts looking like "this passed").
      # Installed on EVERY shard, not just `sqlite`, so a gate moved between
      # shards for cost reasons can never silently lose its oracle. Also the wasm
      # arm of the 3-engine differential (#597, `engines` shard only) — the peer
      # of the `wasm:` job's own call to this action, same toolchain pin. The
      # BINARY is downloaded from `build` (#1928); the toolchain install stays,
      # since clang still compiles this shard's oracles.
      #
      # valgrind is the same story one gate over: it is the MEASUREMENT TOOL for
      # `diff_compiler_ir_scaling` (#2045) and `diff_compiler_stage_ir_scaling`.
      # Installed on every shard for the same cost-not-theme reason as sqlite3
      # above. ⚠️ This used to add "and that gate SKIPS rather than fails without
      # it — so an uninstalled valgrind would read as a quiet non-measurement, not
      # as a red." That WAS true and WAS the hole (#2065): the skip text matched
      # run_gates.sh's LEGIT_SKIP_RE, so a shard that graded no `Ir` at all went
      # green. Both gates now HARD FAIL (exit 1) when valgrind is missing AND `CI`
      # is set, and skip only off CI. So dropping this input no longer goes quiet —
      # it reddens the shard that runs either gate, which is the point. Keep it
      # installed everywhere anyway. ⚠️ "reddens EVERY gates shard" would be
      # wrong, and wrong in the direction this PR is about: only the shards whose
      # `pattern:` actually matches one of the two gates can go red. Today that is
      # `sqlite` (diff_compiler_ir_scaling, :540) and `types`
      # (diff_compiler_stage_ir_scaling, :595) — DERIVE it, do not trust this
      # sentence, because [W-SHARD-COST] moves gates between shards by cost:
      #   grep -n 'ir_scaling' .github/workflows/ci.yml
      - name: Setup medaka (toolchain + wasm arm + downloaded binary)
        if: steps.plan.outputs.has_work == 'true'
        uses: ./.github/actions/setup-medaka
        with:
          sqlite: 'true'
          valgrind: 'true'
          wasm: ${{ matrix.wasm_arm != '' }}
          binary: artifact

      # This shard's oracle set, keyed on the compiler/build-script inputs PLUS
      # the shard's own `pattern` (which oracles get built is DERIVED from the
      # pattern, so a pattern change without the key changing would restore a
      # `test/bin` missing the newly-needed oracles) PLUS `detect`'s `oracle_key`
      # (a narrowed pull_request builds a different, smaller `test/bin` than a
      # full run under what would otherwise be an identical key). The whole of
      # `ci.yml` is hashed rather than just the pattern string, since Actions has
      # no hash-a-string function and a pattern contains characters illegal in a
      # cache key — a comment-only edit therefore also busts the oracle cache,
      # deliberately the safe direction to be wrong in. A collision would fail
      # loudly (run_gates.sh reclassifies a missing oracle as a phantom-skip
      # FAILURE, never a SKIP), never silently. History: dossier `ci.md`.
      - name: Restore cached oracles for this shard
        id: oracle-cache
        if: steps.plan.outputs.has_work == 'true'
        uses: actions/cache@v4
        with:
          path: test/bin
          key: oracles-${{ matrix.name }}-v3-${{ hashFiles('compiler/**', 'stdlib/**', 'runtime/**', 'test/build_native_medaka.sh', 'test/bootstrap_from_seed.sh', 'test/build_oracles.sh', 'Makefile') }}-${{ hashFiles('.github/workflows/ci.yml', '.github/actions/**') }}-${{ needs.detect.outputs.oracle_key }}

      # Only the oracles THIS shard's gates actually read. See the header.
      # Skipped only on an exact cache hit above — a miss always rebuilds with
      # FORCE=1, so a restored oracle is never trusted on mtime alone (a cache
      # restore sets mtimes to extraction time, not original-build time, which
      # would otherwise defeat build_oracles.sh's own staleness check).
      - name: Build the oracles this shard needs
        if: steps.plan.outputs.has_work == 'true' && steps.oracle-cache.outputs.cache-hit != 'true'
        run: FORCE=1 sh test/build_oracles.sh --for ${{ steps.plan.outputs.pats }}

      # build_oracles.sh does not build the wasm emitter oracles (#597) — this
      # shard builds them separately. `--modules-only`: diff_compiler_engines
      # reads exactly one of the three wasm oracles, so building all three here
      # would over-buy; the `wasm:` job's seven gates open all three and build
      # accordingly. Not cached — a pure function of the compiler graph, which
      # the medaka cache above already keys.
      - name: Build the wasm emitter oracle (wasm arm)
        if: steps.plan.outputs.has_work == 'true' && matrix.wasm_arm != ''
        run: |
          export MEDAKA_EMITTER="$PWD/medaka_emitter"
          sh test/wasm/build_wasm_oracle.sh --modules-only

      # Runs the CONCRETE gate list `plan` resolved (never a glob) — the shard's
      # whole pattern on merge_group/push, the diff intersection on a narrowed
      # pull_request. Reclassifies a missing-oracle exit-2 as a FAILURE, not a
      # SKIP, so a shard that ran nothing can never report green. (UNQUOTED
      # substitution is deliberate — quoting would collapse the gate list into
      # ONE argument and silently degrade the shard to a single bad glob.)
      #
      # `full_cores` gives `engines` the whole runner instead of its own
      # ENGINE_JOBS=NCPU/2 hedge (derived from `nproc`, so it tracks runner
      # size). `wasm_arm` sets MEDAKA_REQUIRE_WASM=1 — the shard already
      # installed wasm-tools/Node and built the wasm oracle, so a missing wasm
      # arm here is a WIRING BREAK (exit 1), never the gate's honest elsewhere
      # degradation (exit 2, T2/T3 "NOT RUN"). See diff_compiler_engines.sh.
      - name: Gate shard — ${{ matrix.name }}
        if: steps.plan.outputs.has_work == 'true'
        run: |
          if [ -n "${{ matrix.full_cores }}" ]; then
            export ENGINE_JOBS="$(nproc)"
            echo "engines shard owns this runner: ENGINE_JOBS=$ENGINE_JOBS"
          fi
          # This shard installed wasm-tools + Node and built the wasm oracle above, so an
          # unavailable wasm arm here is a WIRING BREAK, not a dev box without a toolchain.
          # The gate's honest degradation (T2/T3 "NOT RUN") stays the default everywhere
          # else; here it becomes exit 1. See diff_compiler_engines.sh's MEDAKA_REQUIRE_WASM
          # block for why it must be exit 1 and never exit 2 (#597).
          if [ -n "${{ matrix.wasm_arm }}" ]; then
            export MEDAKA_REQUIRE_WASM=1
            echo "${{ matrix.name }} shard: MEDAKA_REQUIRE_WASM=1 — the wasm arm is mandatory here"
          fi
          # ── PER-GATE COST TRANSPORT (#2178) ────────────────────────────────
          # run_gates.sh ALSO writes a machine-readable per-gate timing report
          # here, uploaded by the step below and folded into the committed
          # baseline (test/gate_cost_baseline.json) by test/gate_cost_ingest.sh.
          # Written to $RUNNER_TEMP, deliberately NOT into the tree: the "tree
          # must not have drifted" step below is the whole reason gates may not
          # write into the checkout.
          #
          # ⚠️ THE GUARD IS IN run_gates.sh, NOT IN THIS `env:`. On a
          # `pull_request` — the ONE event `detect` narrows — run_gates.sh
          # refuses to write the file at all, however this step is configured,
          # and gate_cost_ingest.sh independently refuses any report tagged with
          # that event. Setting GATE_TIMING_JSON here unconditionally is
          # deliberate: it keeps the guard structural (in the producer and the
          # consumer, both tested by test/diff_compiler_gate_cost.sh) instead of
          # resting on this expression staying correct.
          export GATE_TIMING_JSON="$RUNNER_TEMP/gate-timings-${{ matrix.name }}.json"
          export GATE_TIMING_SHARD="${{ matrix.name }}"

          # ── AREA-SURFACING (#2178, S-2) ──────────────────────────────────
          # A failing gate must name its semantic AREA and its own name
          # everywhere a human/agent reads a failure — today a reader sees
          # only "${{ matrix.name }} failed". run_gates.sh's own
          # PASS/FAIL/exit-code semantics are UNTOUCHED below: its output is
          # captured to a file (never piped — a pipe would mask the exit
          # code, [D-BUILD-PIPE]) purely so the failing gate NAMES can be
          # read back and their registry `area` looked up, in addition to
          # (never instead of) run_gates.sh's own console output, replayed
          # verbatim right after via `cat`. `run_gates.sh` already prints one
          # `FAILED:<names>` or `PHANTOM-SKIPPED:<names>` summary line on a
          # red run — that is the machine-readable source read here, not a
          # second parallel classification.
          log="$RUNNER_TEMP/gate-run-${{ matrix.name }}.log"
          set +e
          sh test/run_gates.sh ${{ steps.plan.outputs.pats }} > "$log" 2>&1
          rc=$?
          set -e
          cat "$log"

          if [ "$rc" -ne 0 ]; then
            # Source of truth: the registry's `area` field, read ONCE via
            # `medaka gate list --json` — never a second hand-maintained
            # name->area map (§3 of the packet).
            gates_json="$(./medaka gate list --json)"
            failed="$(grep -E '^(FAILED|PHANTOM-SKIPPED):' "$log" | sed -E 's/^(FAILED|PHANTOM-SKIPPED)://' || true)"
            if [ -n "$failed" ]; then
              {
                echo "### ${{ matrix.name }} — failing gates by area"
                echo
                echo "| gate | area |"
                echo "|---|---|"
              } >> "$GITHUB_STEP_SUMMARY"
              for g in $failed; do
                area="$(printf '%s' "$gates_json" | jq -r --arg n "$g" '.[] | select(.baselineKey==$n) | .area')"
                [ -n "$area" ] || area="(unknown — not in registry)"
                echo "::error title=${{ matrix.name }} shard — $g::${{ matrix.name }} shard — $area: $g failed"
                echo "| \`$g\` | $area |" >> "$GITHUB_STEP_SUMMARY"
              done
            fi
          fi

          exit "$rc"

      # Uploaded even when the shard went red — a red run's PASSING gates were
      # still really measured, and the ingest tool drops the failing ones.
      #
      # ⚠️ NOT guarded with `hashFiles(...)`: that function resolves paths
      # relative to GITHUB_WORKSPACE and matches nothing outside it, so an
      # absolute $RUNNER_TEMP path makes it return '' on EVERY run — the guard
      # would read as "no timings here" always, and the step would never fire.
      # `if-no-files-found: ignore` is the correct guard for a file that legitimately
      # does not exist on a pull_request run (where run_gates.sh refuses to write one).
      - name: Upload this shard's per-gate timings
        if: ${{ always() && steps.plan.outputs.has_work == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-timings-${{ matrix.name }}
          path: ${{ runner.temp }}/gate-timings-${{ matrix.name }}.json
          retention-days: 30
          if-no-files-found: ignore

      # THE REVIEW GATE — must be in THIS job, on the tree the gates just ran over.
      # Roc's model: regeneration is the default action and `git diff --exit-code`
      # forces every regenerated byte into review, which is what makes a
      # frictionless `--bless` safe. Today it catches gates that write into the
      # tree; after the snapshot migration lands `medaka snapshot --bless`, it
      # becomes the real guard. Skipped on a docs-only run: nothing above ran.
      - name: The tree must not have drifted
        if: steps.plan.outputs.has_work == 'true'
        run: |
          if ! git diff --exit-code; then
            echo "::error::A gate in the '${{ matrix.name }}' shard modified tracked files."
            echo "::error::Commit them deliberately, or fix the gate that writes into the tree."
            exit 1
          fi
          untracked="$(git status --porcelain --untracked-files=normal | grep -v '^!!' || true)"
          if [ -n "$untracked" ]; then
            echo "::error::A gate in the '${{ matrix.name }}' shard left untracked files behind:"
            echo "$untracked"
            exit 1
          fi

  # ── The trust anchor ─────────────────────────────────────────────────────────
  # `make medaka` asks "CAN I build from the seed?"; `seed-health` asks "does the
  # seed still WORK, and how far has it DRIFTED?" — different questions, and only
  # the second was gated until 2026-07-13 (dossier `ci.md`). Policy: the seed
  # only has to WORK. Byte-currency (C3a) is a drift detector, not a
  # requirement — demanding it forced a costly re-mint history before the
  # policy was fixed (dossier `ci.md`). So drift WARNS and a broken seed FAILS.
  # Re-mint at checkpoints (`make bootstrap` is strict).

  # ── #1932: the DOC half of the old `soundness` job, and nothing else. ────────
  # The five compiler gates that used to live here now run in `compiler-soundness`
  # below. This is an ADD, not a rename: the context name `soundness` must never
  # disappear (it is a required check, and a required context that stops reporting
  # blocks every PR until a ruleset edit — which is not atomic with a commit).
  #
  # ⚠️ UNGUARDED, FOREVER — no `docs_only` guard, no `compiler_touched` guard, no
  # `needs:` on `detect` at all, so there is no output here that a future edit could
  # accidentally narrow on. Every gate below is pure text analysis (no compiler, no
  # binary, seconds), and every one of them polices DOC ROT, which lands in exactly
  # the prose-only PRs a narrowing guard would skip. Guarding a doc gate on
  # `docs_only` skips it on precisely the PRs it exists to police.
  #
  # No `needs: build` either — nothing here reads `./medaka`, so this job no longer
  # waits on the shared build (#1928) it never consumed.
  soundness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # ── DELIBERATELY UNGUARDED: every doc-gate step below runs even when
      # docs_only=true. Guarding a doc gate on docs_only would skip it on
      # precisely the PRs it exists to police. Each needs no compiler (pure
      # text analysis), so each is nearly free to always run. Lives in
      # `soundness` because that job already answers "is the tree coherent?"
      # and is already a required check.
      - name: Docs must not cite dead paths
        run: sh test/check_doc_links.sh

      # Also unguarded, and for the same reason — and this one needs it most. The
      # sibling gate above checks that a doc's cited PATHS exist; this one checks that
      # its cited SYMBOLS do. A repo-wide review found ~44 false concrete claims in the
      # .claude/skills/*/SKILL.md playbooks agents EXECUTE (a `pushTypeError` taught at
      # the wrong arity, a `Show` typeclass that never existed, a 20-name "grep these"
      # index that was 19/20 fictional) — and ~30 were the same mechanical shape: a
      # backticked symbol resolving nowhere in source. Doc rot lands in prose-only PRs,
      # so guarding this on docs_only would skip it on exactly the PRs it must police.
      # Pure text analysis, no compiler.
      - name: Docs must not cite fabricated symbols
        run: sh test/check_agent_doc_symbols.sh

      # Also unguarded, same reason, one layer down each time: PATHS exist (above)
      # -> SYMBOLS resolve (above) -> CLAUSE LABELS have a definition (this gate)
      # -> gate scripts don't PRESCRIBE a dangerous command (next gate). Each
      # closed a real, silent, multi-week rot with the same shape — pure text
      # analysis, no compiler. Incident history: dossier `ci.md`.
      - name: Spec clause citations must resolve to a same-document definition
        run: sh test/check_spec_clause_labels.sh

      - name: No script may prescribe the bare build_oracles.sh
        run: sh test/check_no_banned_oracle_cmd.sh

      # A Bash launcher that re-enters itself through `sh "$0"` changes the
      # interpreter under its own feet. It may pass the outer setup and then
      # fail on Bash syntax deep in a worker path, wasting an entire gate turn.
      # Pure text analysis with fail-capable controls; keep it unguarded.
      - name: Bash scripts must preserve their interpreter when self-invoking
        run: sh test/check_recursive_shell_interpreter.sh

      - name: Mutation transactions must restore on red and interruption
        run: sh test/check_mutation_transaction.sh

      # Also unguarded, same reason (#1451): the lexer's reserved-word list is
      # hand-duplicated into the vscode grammar and the playground tokenizer,
      # with nothing diffing them against it. Pure text analysis, no compiler.
      - name: Editor keyword lists must stay in sync with the lexer
        run: sh test/check_keyword_sync.sh

      # Also unguarded, same reason. docs/README.md is GENERATED from the docs'
      # `**Status:**` banners because a hand-maintained index rots — regenerate
      # here and fail if it differs, or the generator is just a suggestion.
      - name: Docs index must be regenerated, not hand-edited
        run: |
          sh test/gen_docs_index.sh
          if ! git diff --exit-code -- docs/README.md; then
            echo "::error::docs/README.md is stale. Run 'make docs-index' and commit the result."
            exit 1
          fi

  # ── Compiler soundness: two gates documented but never enforced (until a10c2705) ──
  # `typecheck` asks "is the compiler source well-typed?" (the build does not
  # ask). `fixpoint` asks "does the emitter reproduce itself?" (C3a/C3b
  # byte-identical). `gates` runs the compiler; it never typechecks it.
  # `seed-health` proves the seed works; it never proves the source is
  # well-typed or that emission reached a fixpoint. Incident: dossier `ci.md`.
  #
  # ── #1932: the COMPILER half of the old `soundness` job. ────────────────────
  # Split out of `soundness` so a prose-only or project-only PR stops paying for a
  # cold self-compile fixpoint + a compiler-source typecheck + an oracle build. The
  # doc gates above stay unguarded; these five need `./medaka` and are the expensive
  # half. A NEW required context — the ruleset edit that requires it is a separate,
  # non-atomic step, so until it lands this job is advisory.
  #
  # ⚠️ NO job-level `if:` THAT CAN SKIP THE JOB FOR ANYTHING OTHER THAN THE WHOLE RUN
  # BEING CANCELLED — same required-context deadlock hazard as `gates`/`wasm`/`inlang`
  # (read the note on `gates`). The narrowing is at the STEP level, so the job always
  # RUNS and always REPORTS.
  #
  # ⚠️ THE JOB REPORTING IS NOT ENOUGH — IT MUST NOT REPORT GREEN HAVING RUN NOTHING.
  # This is where the step-level shape genuinely differs from `gates`, and an earlier
  # version of this note claimed a parity that did not exist (fix F1). `gates` reaches
  # its "no SKIP, no GREEN-BY-SKIP" property because its `plan` step is UNGUARDED: on a
  # `detect` FAILURE every output is the empty string, `plan` still runs, and the shard
  # falls through to a full run (and the artifact download then fails, correctly red).
  # A step guarded only on the classifier's outputs has the opposite failure mode:
  # unwritten outputs make `compiler_touched == 'true'` FALSE, so EVERY guarded step
  # SKIPS and this required context reports SUCCESS having run nothing. Hence the
  # leading `needs.detect.result != 'success'` disjunct on every step guard below (and
  # on `inlang`'s and `wasm`'s): the classifier's answer is trusted ONLY when `detect`
  # actually succeeded and therefore actually published one. `success` is the only
  # `needs.<job>.result` value that means "the outputs are real" — `failure`,
  # `cancelled`, and `skipped` all leave them empty — so on any of the other three the
  # steps run unguarded and the job fails safe exactly as `gates` does. When `detect`
  # DOES succeed the disjunct is false and the narrowing is bit-for-bit as before.
  #
  # The guard is `compiler_touched` ORed with THIS job's OWN escape list
  # (`soundness_corpora`), never a widened predicate — see the `detect` job's
  # `outputs:` block. The escape list is NOT optional here and is not a stylistic
  # echo of `wasm`/`inlang`: `test/must_fail_fixtures/**` and
  # `test/diff_compiler_must_fail.sh` sit OUTSIDE `./medaka`'s build closure, so
  # `compiler_touched` alone is FALSE for a PR that only edits a fixture — and under
  # the must-fail suite's INVERTED polarity a fixture that never runs reports as
  # "drained". You would be paid in green for silently un-pinning a live soundness
  # bug. That counterexample is why the list exists.
  compiler-soundness:
    # `build` for the binary (#1928); `detect` for its outputs. Same `if:` as `gates`.
    needs: [detect, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Toolchain still needed (clang builds the typecheck oracle; the fixpoint
      # gate cold-bootstraps from the seed on its own); the BINARY comes from
      # `build` (#1928).
      - name: Setup medaka (toolchain + downloaded binary)
        if: ${{ needs.detect.result != 'success' || (needs.detect.outputs.docs_only != 'true' && (needs.detect.outputs.compiler_touched == 'true' || needs.detect.outputs.soundness_corpora == 'true')) }}
        uses: ./.github/actions/setup-medaka
        with:
          binary: artifact

      # ── Fingerprint mirror parity (#267, PR #263) ───────────────────────────
      # `test/build_native_medaka.sh` and `compiler/driver/medaka_cli.mdk` are
      # two hand-synced reimplementations of the same source-fingerprint hash;
      # #182 broke the mirror once and only human review caught it, no gate
      # proved the two agreed. This one does — see dossier `ci.md`.
      - name: Fingerprint mirror must still agree (issue #267)
        if: ${{ needs.detect.result != 'success' || (needs.detect.outputs.docs_only != 'true' && (needs.detect.outputs.compiler_touched == 'true' || needs.detect.outputs.soundness_corpora == 'true')) }}
        run: sh test/check_fingerprint_parity.sh

      # `typecheck_compiler_source.sh` exits 2 (SKIP) when its oracle is absent,
      # indistinguishable from a pass in CI — so build the oracle first and
      # assert on the PASS line, not the exit status.
      - name: Build the typecheck oracle
        if: ${{ needs.detect.result != 'success' || (needs.detect.outputs.docs_only != 'true' && (needs.detect.outputs.compiler_touched == 'true' || needs.detect.outputs.soundness_corpora == 'true')) }}
        run: FORCE=1 sh test/build_oracles.sh --build-one diagnostics_project_main

      # ── The MUST-FAIL suite: the tracker's self-drain (#547) ────────────────
      # Every fixture asserts an OPEN issue's bug still reproduces; a fix landing
      # turns this RED, and the message says to close the issue.
      # ⚠️ LIVES HERE, NOT IN A GATE SHARD, and that is load-bearing: shards are
      # narrowed on `pull_request`, and no hand-maintained bug-to-file map could
      # derive this gate from a diff without rotting on the first new fixture.
      # `soundness` runs FULL on every event and is already required. Guarded on
      # docs_only, correctly here — this needs the compiler. History: dossier `ci.md`.
      - name: Open bugs must still reproduce (must-fail suite — a RED here means someone FIXED something)
        if: ${{ needs.detect.result != 'success' || (needs.detect.outputs.docs_only != 'true' && (needs.detect.outputs.compiler_touched == 'true' || needs.detect.outputs.soundness_corpora == 'true')) }}
        run: sh test/diff_compiler_must_fail.sh

      # `selfcompile_fixpoint.sh` asserts C3a AND C3b, the right bar for a
      # checkpoint re-mint but the wrong bar for CI: C3b (the compiled compiler
      # reproduces its own output) is soundness and must hard fail; C3a (the
      # seed is byte-current) is a drift detector and must only warn — blocking
      # on it would turn CI red on every emitter change. Assert on the verdict
      # lines below, never the script's raw exit status (`| tee` would mask it
      # anyway). Typecheck and fixpoint run overlapped (independent, read-only,
      # separate scratch paths) but the must-fail suite above is EXCLUDED from
      # that overlap — its fixtures carry fail-capable timing alarms that CPU
      # contention has already flipped from a real failure into a false
      # timeout. History: dossier `ci.md`.
      - name: Compiler source is well-typed and emitter reproduces itself
        if: ${{ needs.detect.result != 'success' || (needs.detect.outputs.docs_only != 'true' && (needs.detect.outputs.compiler_touched == 'true' || needs.detect.outputs.soundness_corpora == 'true')) }}
        run: |
          set +e
          JOBS=3 bash test/typecheck_compiler_source.sh > /tmp/tc.log 2>&1 &
          typecheck_pid=$!
          bash test/selfcompile_fixpoint.sh > /tmp/fp.log 2>&1 &
          fixpoint_pid=$!

          wait "$typecheck_pid"
          typecheck_rc=$?
          echo "::group::Compiler source typecheck"
          cat /tmp/tc.log
          echo "::endgroup::"

          wait "$fixpoint_pid"
          echo "::group::Self-compile fixpoint"
          cat /tmp/fp.log
          echo "::endgroup::"
          set -e

          failed=0
          if [ "$typecheck_rc" -ne 0 ] || ! grep -q 'PASS: compiler source is type-clean' /tmp/tc.log; then
            echo "::error::The compiler source is ILL-TYPED (or the gate skipped). The build does not gate on this — that is why the gate exists."
            failed=1
          fi
          # A skip is not a pass. We just installed clang+libgc, so a toolchain skip here
          # means something is wrong, not absent.
          if grep -q 'skipping spike' /tmp/fp.log; then
            echo "::error::The fixpoint gate SKIPPED on a runner with a full toolchain. A skip is not a pass."
            failed=1
          fi
          if ! grep -q 'C3b PASS' /tmp/fp.log; then
            echo "::error::NO FIXPOINT: the compiled compiler does not reproduce its own output (C3b). This is a miscompile in the emitter."
            failed=1
          fi
          if grep -q 'C3a FAIL' /tmp/fp.log; then
            echo "::warning::Seed has DRIFTED from current emission (it still works, and the compiler still reaches a fixpoint). Re-mint at the next checkpoint: sh test/refresh_seed.sh"
          fi
          exit "$failed"

  seed-health:
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Setup medaka (toolchain only)
        if: needs.detect.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-medaka
      - name: Seed must still build a working emitter (drift only warns)
        if: needs.detect.outputs.docs_only != 'true'
        run: |
          sh test/bootstrap_from_seed.sh 2>&1 | tee /tmp/seed.log
          # A seed that cannot do its job is a HARD failure — the script exits
          # nonzero for that, and `set -e`-less `tee` would hide it, so check.
          if ! grep -q 'BOOTSTRAP-FROM-SEED PASS' /tmp/seed.log; then
            echo "::error::The seed can no longer build a working emitter. Re-mint: sh test/refresh_seed.sh"
            exit 1
          fi
          # Drift is informative, not actionable-right-now. Surface it, don't block.
          if grep -q 'C3a WARN' /tmp/seed.log; then
            echo "::warning::Seed has DRIFTED from current emission (still works). Re-mint at the next checkpoint: sh test/refresh_seed.sh"
          fi

  # ── The in-language suite: doctests, properties, `test "..."` decls ───────────
  inlang:
    # `build` for the binaries (#1928); `if:` guard as on `gates` above.
    needs: [detect, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # #1931. The job-level `if:` stays `!cancelled()` — NEVER a job-level skip, or
      # the required context deadlocks. The narrowing is at the STEP level, and it is
      # the build-closure predicate ORed with THIS job's own corpus list, never a
      # widened predicate. A prose-or-project-only PR now stops paying for `make test`;
      # a compiler-touching PR runs exactly as before.
      # The leading `needs.detect.result != 'success'` disjunct is the fail-safe: an
      # output-only guard reads a FAILED `detect`'s empty outputs as "narrow to
      # nothing" and reports this required context GREEN having run nothing. Full
      # rationale at the head of `compiler-soundness` (fix F1).
      - name: Setup medaka (toolchain + downloaded binary)
        if: ${{ needs.detect.result != 'success' || (needs.detect.outputs.docs_only != 'true' && (needs.detect.outputs.compiler_touched == 'true' || needs.detect.outputs.inlang_corpora == 'true')) }}
        uses: ./.github/actions/setup-medaka
        with:
          binary: artifact
      # ⚠️ THE ONE CONSUMER JOB THAT RUNS `make`. `make test` depends on the `.PHONY`
      # `medaka` target, so it re-enters test/build_native_medaka.sh, whose stage B
      # (the clang link of ./medaka, ~55 s) is otherwise unconditional — it would
      # overwrite the binary this job just downloaded and eat the whole #1928 win for
      # this job. SKIP_CLI_LINK_IF_FRESH=1 makes stage B honour `.medaka.srcstamp`
      # (which travels with the artifact, same-SHA invariant as the emitter stamp) and
      # skip the relink. Stage A already skips via `.medaka_emitter.srcstamp`.
      # Deliberately scoped to THIS step: the flag is default-off everywhere else, so
      # the local dev loop and every other caller relink exactly as before.
      - name: Doctests, properties, and test decls
        if: ${{ needs.detect.result != 'success' || (needs.detect.outputs.docs_only != 'true' && (needs.detect.outputs.compiler_touched == 'true' || needs.detect.outputs.inlang_corpora == 'true')) }}
        env:
          SKIP_CLI_LINK_IF_FRESH: '1'
        run: make test

  # ── T25: the WasmGC backend gates ─────────────────────────────────────────────
  # WasmGC is one of Medaka's TWO production backends and the engine the
  # playground runs on, yet its gates ran in NO CI job until T25 — a stock
  # runner lacks the toolchain and the gates SKIP (exit 2) when it's absent, so
  # nothing was watching, and two silent wasm miscompiles reached main that way.
  # History: dossier `ci.md`.
  #
  # ONE job, not six more gate shards: only these gates need the wasm toolchain,
  # and adding it to every `gates` shard would tax all eight for a tool one job
  # needs. These seven gates are NOT sharded (no matrix `pattern:`) — each is
  # invoked by its LITERAL repo-relative path below, the coverage gate's "named
  # gate" mechanism (same as `soundness`'s fixpoint + typecheck gates).
  #
  # ⚠️ NO job-level `if:` THAT CAN SKIP THE JOB FOR ANYTHING OTHER THAN THE WHOLE
  # RUN BEING CANCELLED — same required-context deadlock risk as every other
  # heavy job. The guard below is safe because it only skips on
  # cancellation; STEPS remain the thing gated on `docs_only`. Runs on every
  # non-docs event, NOT narrowed (these seven ARE the whole wasm surface and are
  # cheap enough to run in full).
  #
  # A REQUIRED CHECK, in a repository RULESET (not classic branch protection —
  # the classic endpoint 404s "Branch not protected", which reads exactly like
  # "nothing is required" and is how an earlier version of this note rotted).
  # Derive live, never trust a date in this file:
  #   gh api repos/MedakaLang/medaka/rulesets --jq '.[]|{id,name,enforcement}'
  #   gh api repos/MedakaLang/medaka/rulesets/<id> \
  #     --jq '.rules[]|select(.type=="required_status_checks")
  #            |.parameters.required_status_checks[].context'
  wasm:
    # `build` for the binaries (#1928); `if:` guard as on `gates` above.
    needs: [detect, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # wasm-tools/Node versions come from setup-medaka's own input defaults — shared
    # verbatim with the `engines` gate shard's call to the same action, which installs
    # the same toolchain for the 3-engine differential's T2/T3 arms (#597). Do not
    # override either here; that is precisely the drift the single source prevents.
    steps:
      - uses: actions/checkout@v4

      # node >= 22 is required for the finalized WasmGC 3.0 GC encoding these gates emit
      # (test/wasm/run.js). ubuntu-latest ships an older node, so this pins 24 (the dev
      # box's). wasm-tools (parse + validate the emitted WAT) is NOT on a stock runner
      # either — the pinned prebuilt release is downloaded and extracted OUTSIDE the
      # checkout (see the action for why).
      # #1931. Step-level narrowing only; the job-level `if:` above stays
      # `!cancelled()`. `compiler_touched` is the build-closure predicate and is NOT
      # widened to cover sqlite/gzip/playground — that list is THIS job's, ORed in here,
      # so the predicate keeps one meaning for every other reader.
      # The leading `needs.detect.result != 'success'` disjunct is the fail-safe: an
      # output-only guard reads a FAILED `detect`'s empty outputs as "narrow to
      # nothing" and reports this required context GREEN having run nothing. Full
      # rationale at the head of `compiler-soundness` (fix F1).
      - name: Setup medaka (toolchain + wasm + downloaded binary)
        if: ${{ needs.detect.result != 'success' || (needs.detect.outputs.docs_only != 'true' && (needs.detect.outputs.compiler_touched == 'true' || needs.detect.outputs.wasm_corpora == 'true')) }}
        uses: ./.github/actions/setup-medaka
        with:
          wasm: 'true'
          binary: artifact

      # The three WasmGC emitter oracle binaries (wasm_emit_main / _typed_ / _modules_)
      # that these gates drive. Cheap; deliberately NOT cached (they are a pure
      # function of the whole compiler graph, which the medaka cache above already keys).
      - name: Build the wasm emitter oracles
        if: ${{ needs.detect.result != 'success' || (needs.detect.outputs.docs_only != 'true' && (needs.detect.outputs.compiler_touched == 'true' || needs.detect.outputs.wasm_corpora == 'true')) }}
        run: |
          export MEDAKA_EMITTER="$PWD/medaka_emitter"
          sh test/wasm/build_wasm_oracle.sh

      # The gates, each invoked by its LITERAL repo-relative path — that literal is
      # what makes diff_compiler_ci_shard_coverage.sh classify them "covered" (see the
      # COVERAGE note above). Run DIRECTLY, not via run_gates.sh: a direct exit 2 (a
      # toolchain skip) then FAILS the job instead of being reclassified as a skip — and
      # "a skip is not a pass" is the entire reason this gate coverage hole existed. All
      # all run (|| rc=1) before the job fails, so one red gate never hides the others.
      - name: WasmGC backend gates
        if: ${{ needs.detect.result != 'success' || (needs.detect.outputs.docs_only != 'true' && (needs.detect.outputs.compiler_touched == 'true' || needs.detect.outputs.wasm_corpora == 'true')) }}
        run: |
          set -u
          export MEDAKA_EMITTER="$PWD/medaka_emitter"
          export MEDAKA_WASM_EMITTER="$PWD/test/bin/wasm_emit_modules_main"
          rc=0
          bash test/wasm/diff_wasm.sh          || rc=1
          bash test/wasm/diff_wasm_typed.sh    || rc=1
          bash test/wasm/diff_playground_input.sh || rc=1
          bash test/wasm/diff_visitor_cost_bytes.sh || rc=1
          bash test/wasm/diff_wasm_modules.sh  || rc=1
          bash test/wasm/diff_wasm_emitted_size.sh || rc=1
          bash test/wasm/diff_wasm_ffi_wall.sh || rc=1
          bash test/wasm/diff_sqlite.sh        || rc=1
          bash test/wasm/diff_gzip.sh          || rc=1
          bash test/build_wasm_cmd.sh          || rc=1
          exit $rc

  # The gates-matrix GENERATED region's own drift gate (#2177, S-3). 🚨 REQUIRED
  # — this comment said "ADVISORY ONLY (not yet in the required-checks ruleset)"
  # until 2026-08-30, by which point the promotion had already happened and the
  # comment had not followed; the ruleset edit is deliberately NOT atomic with a
  # commit, which is exactly how a claim like that goes stale unnoticed. Do not
  # trust this line either — derive the set:
  #   gh api repos/MedakaLang/medaka/rulesets --jq '.[]|select(.enforcement=="active")|.id'
  #   gh api repos/MedakaLang/medaka/rulesets/<id> \
  #     --jq '.rules[]|select(.type=="required_status_checks")|.parameters.required_status_checks[].context'
  # It matters because "is a red `ci-gen-drift` blocking?" is answered here
  # first, and the wrong answer costs a merge. See docs/ops/CI-ARCHITECTURE.md
  # §3.2 for the promotion command. Own job, not folded into `soundness`,
  # because unlike that job's doc gates this one needs the built binary
  # (`medaka gate ci` is in-binary) — `needs`/`if:` shape copied from
  # `compiler-soundness`/`wasm` above.
  ci-gen-drift:
    needs: [detect, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # ⚠️ STEP-guarded on `docs_only`, never job-guarded — this is a REQUIRED
      # context and a skipped job does not report. Same shape and reason as
      # `build` and the `gates` matrix above. WHY the guard is needed at all:
      # `build` skips its own upload on a docs-only run, so `medaka-binaries`
      # DOES NOT EXIST there — `needs: build` is satisfied by a job that
      # succeeded having produced nothing, and an unguarded download here dies
      # with "Artifact not found", reddening a required check on every prose-only
      # PR (#2269). WHY skipping the gate is sound rather than a hole: `detect`
      # is a prose ALLOWLIST, so `docs_only=true` already entails that neither
      # the generated matrix region nor `test/gates.toml` changed — there is
      # nothing for this gate to prove on such a run.
      - name: Setup medaka (toolchain + downloaded binary)
        if: needs.detect.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-medaka
        with:
          binary: artifact

      - name: Generated gates-matrix region must not drift or be hand-edited
        if: needs.detect.outputs.docs_only != 'true'
        run: sh test/diff_compiler_ci_gen_drift.sh

  # ── The per-gate cost transport (#2178, S-1-S-cost-record) ───────────────────
  # Its own job rather than a `gates` matrix row: the gate is binary-free,
  # oracle-free and costs milliseconds (it builds a scratch tree with one fake
  # gate), and adding a row would have meant regenerating the matrix, which
  # belongs to a later slice. UNGUARDED — no `docs_only` / `narrow` condition and
  # no `needs:` — because what it grades is the POISONING GUARD on the cost
  # baseline, and the run it must never stop policing is precisely a narrowed
  # `pull_request` one.
  gate-cost:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Per-gate cost transport — producer + ingest admission guard
        run: sh test/diff_compiler_gate_cost.sh

  # ── The shard balancer (#2178, S-3-S-balancer) ───────────────────────────────
  # Its own job, mirroring `ci-gen-drift` above: it needs ./medaka (it drives
  # `medaka gate balance`) but nothing else, and it costs seconds.
  #
  # ⚠️ A JOB AND NOT A `gates` MATRIX ROW, deliberately. This gate grades the
  # thing that CHOOSES matrix rows, so a balancer bug that mis-packed the matrix
  # would move this gate too — a check cannot be a member of the set it
  # certifies. That is also why its registry entry is `shard = "other-job"`.
  #
  # Added in S-3 rather than S-4 only because it has to be: enrolling a gate as
  # `other-job` with no workflow step naming it is exactly what
  # `diff_compiler_ci_shard_coverage.sh` refuses ("SILENTLY NEVER RUN"), so the
  # enrolment and the job are one change. It touches nothing inside the
  # GENERATED gates-matrix region.
  gate-balance:
    needs: [detect, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Step-guarded on `docs_only` for the same reason as `ci-gen-drift` above
      # (#2269): `build` uploads no artifact on a prose-only run, and
      # `docs_only=true` already entails `test/gates.toml` and
      # `test/gate_cost_baseline.json` are untouched, so the balancer has
      # nothing to check. Not a required context today, but guarded anyway —
      # a red advisory check on every doc PR is noise that trains readers to
      # ignore it.
      - name: Setup medaka (toolchain + downloaded binary)
        if: needs.detect.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-medaka
        with:
          binary: artifact

      - name: Shard balancer — idempotence, constraints, cost refusals
        if: needs.detect.outputs.docs_only != 'true'
        run: sh test/diff_compiler_gate_balance.sh

  # ── The budget governor (#2180, S-5) ─────────────────────────────────────────
  # Its own job, mirroring `gate-balance` immediately above: it needs ./medaka
  # (it drives `medaka gate budget`) and an AUTHORED commit message from the
  # change under test (there is no PR body in a `merge_group` run), nothing
  # else.
  #
  # ⚠️ AUTHORED, NOT `git log -1` ON HEAD (FR-2, review finding S1-2). The
  # `actions/checkout@v4` above takes no `ref:`, so on `pull_request` it checks
  # out `refs/pull/N/merge` and on `merge_group` the queue's auto-merge commit
  # — a SYNTHETIC merge commit in both cases, whose message is GitHub
  # boilerplate ("Merge pull request #N from ...") and never the text an author
  # pasted the `Gate-Budget-Override:` trailer into. Reading HEAD's message on
  # those two events — the only two that gate a merge — made the override
  # mechanism unreadable, i.e. an un-overridable governor. The resolve step
  # below re-derives the real authored range from the EVENT PAYLOAD's SHAs and
  # exports it; `test/diff_compiler_gate_budget.sh` prefers that over HEAD.
  #
  # ⚠️ A JOB AND NOT A `gates` MATRIX ROW, for the same reason `gate-balance`
  # is one: this gate grades the projected pole/floor, so it must not be able
  # to move the number it grades by entering packing itself — that is also
  # why its registry entry is `shard = "other-job"`.
  #
  # NOT YET in the required-checks ruleset (same state `ci-gen-drift` started
  # in, and the same state `gate-cost`/`gate-balance` are still in as of this
  # slice) — adding a required context is a separate, non-atomic `gh api`
  # ruleset edit; see this slice's report for the exact command and why it
  # was not run in this PR.
  gate-budget:
    needs: [detect, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    # `cost = "cheap"` in test/gates.toml declares a 300s (`timeoutFor`) kill
    # timeout; this job's own ceiling must not silently permit more than that
    # (FR-5, review finding S3-6). 5 minutes (300s) matches; this gate is
    # text-only with no build, so it's ample headroom over an actual run.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Step-guarded on `docs_only`, same as `ci-gen-drift` / `gate-balance`
      # above (#2269). All THREE steps carry the guard, not just the download:
      # the override-channel resolution below exists only to feed the gate step,
      # so running it alone would do targeted fetches to populate an env var
      # nothing then reads.
      - name: Setup medaka (toolchain + downloaded binary)
        if: needs.detect.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-medaka
        with:
          binary: artifact

      # Resolves the override channel BEFORE the gate runs. Every payload field
      # is read through `env:` rather than interpolated into the script body —
      # `${{ }}` inside `run:` is textual substitution and an attacker-authored
      # branch name or message would be shell, not data.
      - name: Resolve the authored commit message(s) — the override channel
        if: needs.detect.outputs.docs_only != 'true'
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          MG_REF: ${{ github.event.merge_group.head_ref }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -u
          echo "event: $EVENT"

          # HEAD's own message, printed for CONTRAST, not for use. On
          # `pull_request`/`merge_group` this is the synthetic merge commit's
          # boilerplate. Printing it beside the resolved text is what makes a
          # future regression of S1-2 visible in the log instead of silent.
          echo "--- checked-out HEAD $(git rev-parse HEAD) (SYNTHETIC on pull_request/merge_group):"
          git log -1 --pretty=%B HEAD

          base=""; head=""
          case "$EVENT" in
            pull_request*) base="$PR_BASE"; head="$PR_HEAD" ;;
            merge_group)
              # `pull_request.{base,head}.sha` are long-standing documented
              # fields; the `merge_group` payload's are NOT enumerated in
              # GitHub's webhook docs, so this arm must not DEPEND on their
              # names. Verified live instead: a merge_group run's `github.sha`
              # IS the queue's auto-merge commit (measured — the run for PR
              # #2212 resolved to 93a40382), and the queue branch is named
              # `gh-readonly-queue/<base-branch>/pr-<N>-<base-sha>`, so the
              # base is recoverable from the ref when the field is not.
              head="$MG_HEAD"
              [ -n "$head" ] || head="$GH_SHA"
              base="$MG_BASE"
              if [ -z "$base" ]; then
                cand="${MG_REF##*-}"
                case "$cand" in
                  [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) base="$cand" ;;
                esac
              fi
              ;;
          esac

          # `push` / `workflow_dispatch` / `schedule` check out the author's
          # real commit, so HEAD's message IS the authored one. Leave the
          # variable UNSET (not empty) and the gate keeps today's `git log -1`
          # behaviour verbatim on those events.
          if [ -z "$head" ]; then
            echo "--- '$EVENT' checks out the real commit — leaving GATE_BUDGET_COMMIT_MSG unset (gate reads HEAD)."
            exit 0
          fi

          # Same targeted-fetch pattern the `detect` job uses: make specific
          # commit objects reachable regardless of this job's own shallow
          # checkout. depth=50, not depth=1, because we want the RANGE
          # base..head — every authored commit in the PR, or every PR batched
          # into this merge group — not just one commit.
          git cat-file -e "$head" 2>/dev/null || git fetch --no-tags --depth=50 origin "$head" 2>/dev/null || true
          git cat-file -e "$base" 2>/dev/null || git fetch --no-tags --depth=50 origin "$base" 2>/dev/null || true

          msg=""
          if git cat-file -e "$head" 2>/dev/null && git cat-file -e "$base" 2>/dev/null; then
            msg="$(git log --pretty=%B "$base..$head" 2>/dev/null || true)"
          fi
          if [ -z "$msg" ] && git cat-file -e "$head" 2>/dev/null; then
            # Range unavailable (base unreachable, or a shallow boundary cut it
            # short). On `merge_group` the head is ITSELF the auto-merge commit,
            # so the authored message lives on its SECOND PARENT — measured on
            # this repo: 93a40382 is "Merge pull request #2212 from ...", and
            # 93a40382^2 = 1c1b48f3 carries the real text.
            if [ "$EVENT" = "merge_group" ] && git cat-file -e "$head^2" 2>/dev/null; then
              msg="$(git log -1 --pretty=%B "$head^2" 2>/dev/null || true)"
            else
              msg="$(git log -1 --pretty=%B "$head" 2>/dev/null || true)"
            fi
          fi

          echo "--- resolved authored message(s) for $base..$head:"
          printf '%s\n' "$msg"

          # Exported even when EMPTY: set-but-empty means "resolved, no override
          # text", which the gate honours as fail-CLOSED. Only an entirely
          # ABSENT variable licenses the HEAD fallback, so a resolution failure
          # here can never silently re-open the synthetic-merge hole.
          delim="GATE_BUDGET_MSG_EOF_$(printf '%s' "$msg" | sha1sum | cut -c1-20)"
          {
            echo "GATE_BUDGET_COMMIT_MSG<<$delim"
            printf '%s\n' "$msg"
            echo "$delim"
          } >> "$GITHUB_ENV"

      - name: Budget governor — uncosted / over-class / pole-floor, with override
        if: needs.detect.outputs.docs_only != 'true'
        run: sh test/diff_compiler_gate_budget.sh
