name: CI

# GitHub-HOSTED runners. Free and unlimited for public repositories, 20 concurrent
# jobs on the Free plan. No self-hosted runner — a fork PR on a public repo with one
# is arbitrary code execution on the runner host. Do not reintroduce one.
#
# ── Oracles build per shard; the binary builds once ─────────────────────────────
# Two different questions. ORACLES: no gate needs all 54, so each shard builds only
# the handful its own gates read (`build_oracles.sh --for '<pattern>'`, the same
# derivation `test/preflight.sh` uses locally). THE BINARY (`build:` job, #1928): a
# pure function of the checkout, so it builds exactly once and the other jobs
# download it — never rebuilt per shard. History/measurements: dossier `ci.md`.
#
# The drift check (`git diff --exit-code` after the gates run) lives INSIDE each
# shard, not as a separate job — a fresh checkout in a fresh VM would never see
# drift caused by gates that ran somewhere else.
#
# ── Why the Medaka binary is not cached across runs (#111) ──────────────────────
# `./medaka`/`./medaka_emitter` depend on files that change on every non-docs
# compiler PR, so a correctness-safe cache key can never hit on the runs that need
# it. This is about cross-run CACHING and is unrelated to the `build:` job above,
# which is intra-run transport at a fixed SHA — no key, no cross-SHA restore.
# Per-shard `test/bin/*` oracle caches remain below; never add a partial
# `restore-keys` fallback, which would turn stale oracles into plausible greens.
#
# ── The PR run is NARROWED by GATE. The merge_group run, only by PROJECT. (T-15)
# `pull_request`: each `gates_N` shard runs only the intersection of its pattern
# with the gate set `detect` derives from the diff. `merge_group`: every shard runs
# its full pattern MINUS the library-project gates the diff provably cannot reach
# (#2179 — see `project_reach` below). `push`/`schedule`/`workflow_dispatch`: every
# shard runs its full pattern, unconditionally, always.
#
# ⚠️ WHAT NEVER NARROWS ON `merge_group` (it still narrows on `pull_request`,
# same as everything else — see T-15 above): every gate the registry marks
# `project = "compiler"` — the whole compiler gate suite — plus `soundness`,
# `compiler-soundness`, `wasm` and `seed-health`. Only `soundness` is
# unconditional on EVERY event; the other three are still `pull_request`-
# narrowed by their own `docs_only`/`compiler_touched`/corpora guards, exactly
# like the compiler gate shards. The queue's whole value is testing the MERGED
# result — two independently-green branches have auto-merged into a broken
# tree with zero git conflicts more than once, and no per-PR check can see
# that. Those incidents were ALL compiler-infra collisions, which is why that
# half stays load-bearing and queue-narrowing the compiler suite is out of
# scope (Val, 2026-08-28; docs/ops/CI-ARCHITECTURE.md §3.4). `soundness` is the
# backstop for a different hole: all gate shards pass on an ill-typed compiler
# (`make medaka` does not gate on type errors).
#
# ⚠️ WHAT NOW NARROWS ON `merge_group`: the LIBRARY-PROJECT gates only — a gate
# whose registry `project` is one of the manifest-bearing projects outside
# `compiler/` (byteparser, gzip, mq, parsec, pds, sqlite). Same shape as the
# `pull_request` narrowing above and the same derivation (`test/preflight.sh`),
# but keyed on PROJECT, not on gate: an entry runs a project's gates unless the
# project graph proves the diff cannot reach that project. Narrowing fails SAFE in
# every direction, on both events (preflight erroring, reporting whole-suite blast
# radius, having no opinion about a changed path, a changed path outside every
# project directory, or a gate whose project the registry cannot resolve all widen
# back to everything) — see the `gateset` and `reach` steps. Incident history:
# dossier `ci.md`.
#
# ── `push: main` REMOVED — the queue already covers it (#1927) ─────────────────
# Every commit reaching `main` was already tested by a `merge_group` run at that
# exact SHA (the queue only merges what went green there), so a separate
# `push: main` run was a byte-for-byte duplicate paid twice per merge for zero new
# signal. `schedule` below is the cheap safety net for anything that could still
# land outside the queue.
on:
  push:
    branches: [testing-arc]
  pull_request:
  # REQUIRED BY THE MERGE QUEUE — a queued PR is tested on a `merge_group` event, a
  # temp branch holding this PR merged onto everything already queued ahead of it.
  # Without this trigger the required checks never run on that branch, the entry
  # waits forever, and the queue DEADLOCKS. Do not remove it while a merge queue
  # exists. PR CI tests the BRANCH; the queue tests the MERGED RESULT — those have
  # diverged before (dossier `ci.md`). merge_group:
  merge_group:
  workflow_dispatch:
  # Safety net for #1927 (removed `push: main`) + the oracle-cache producer — a
  # genuine, unnarrowed full-suite run of `main` once a day (also reachable via
  # `workflow_dispatch` above). Its `oracle_key` is 'full', so it is the daily
  # producer of the cache a `merge_group` run restores from the default branch.
  schedule:
    - cron: '43 9 * * *' # arbitrary off-the-hour time, ahead of nightly.yml's 07:17

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Oracles are throwaway binaries; -O0 builds them much faster and their runtime is
  # hidden by parallelism. The emitter is the reused workhorse and stays -O2.
  ORACLE_OPT: -O0

  # The wasm toolchain pin (#1936) is NOT set here — it lives as the single
  # `wasm-tools-version` / `wasm-node-version` input default on
  # `.github/actions/setup-medaka/action.yml`, which every consumer (this file's
  # `gates`/`wasm` jobs, and nightly.yml) reads by not overriding it.

jobs:
  # ── T-4b: docs-only fast path ───────────────────────────────────────────────
  # A change that touches ONLY prose (top-level *.md, docs/**, LICENSE) skips the
  # heavy jobs' EXPENSIVE STEPS, never the jobs themselves. The required status
  # checks (derive them: `gh api repos/MedakaLang/medaka/rulesets/18885875 --jq
  # '.rules[]|select(.type=="required_status_checks")|.parameters.required_status_checks[].context'`)
  # are the merge gate, with ZERO approvals — so a job skipped by a job-level
  # `if:`, or a workflow skipped by a `paths-ignore:` trigger filter, never
  # posts a status; the PR sits at
  # "Expected — waiting for status" FOREVER and becomes permanently unmergeable.
  # ⚠️ Do NOT convert this into a job-level `if:`, and do NOT path-filter `on:`.
  # Every required job always RUNS and always REPORTS; only its STEPS are
  # conditional.
  #
  # ⚠️ THE RULE: `test/**` is NEVER docs (it holds functional goldens, not prose —
  # a naive `**.md` filter would skip the gates that exist to catch a bad golden
  # re-cut). `docs/spec/SYNTAX.md` and `docs/guide/*.md` are likewise never docs
  # — they are executable documentation that `check_syntax_examples.sh` runs,
  # and shipped false for months once while nothing checked them. These arms
  # must come first in the case below.
  # Everything else ending in `.md` is prose. Scoped to the `.md` EXTENSION on
  # purpose — `.claude/`/`compiler/`/`runtime/` also hold executable non-`.md`
  # files that must fall through to the catch-all as NOT docs.
  #
  # Conservative in the direction that matters: any unrecognized path routes to
  # the full suite. Only meaningful for `pull_request`; every other trigger
  # defaults `docs_only=false`. Incident history: dossier `ci.md`.
  detect:
    name: detect docs-only change
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      # #1931/#1932. FOUR more outputs from the SAME single pass over changed.txt (one
      # classifier, N outputs — never a second walk that could drift from this one).
      #
      # `compiler_touched` answers ONE question and one only: does this diff touch the
      # build closure of `./medaka` — compiler/stdlib/runtime sources plus the scripts
      # that build them? It is deliberately NOT widened into "anything a heavy job
      # reads". A job that also reads corpora OUTSIDE that closure publishes its own
      # escape-list output below and ORs the two AT THE STEP LEVEL, so the predicate
      # keeps a single meaning and each corpus list stays next to the job that owns it.
      # Widening the predicate itself is how one flag silently acquires two meanings
      # and the next job to read it inherits the wrong one.
      compiler_touched: ${{ steps.classify.outputs.compiler_touched }}
      # The `wasm` job's OWN escape list: the corpora its seven gates read from outside
      # the build closure (sqlite/, gzip/, playground/, test/wasm/, and the engine and
      # llvm fixture corpora two of them borrow). Derived in `classify`, consumed ONLY
      # by `wasm`.
      wasm_corpora: ${{ steps.classify.outputs.wasm_corpora }}
      # The `inlang` job's OWN escape list, same shape: `make test` runs
      # test/diff_compiler_ported.sh over the test/ported/ corpus, which is not in
      # `./medaka`'s build closure. Consumed ONLY by `inlang`.
      inlang_corpora: ${{ steps.classify.outputs.inlang_corpora }}
      # #1932. The `compiler-soundness` job's OWN escape list, same shape as the two
      # above. Its five gates read the must-fail fixture corpus and their own gate
      # scripts, none of which is in `./medaka`'s build closure — so a PR that only
      # edits `test/must_fail_fixtures/**` has compiler_touched=false while being
      # EXACTLY the PR that suite must run on (inverted polarity: a fixture that never
      # runs reports as "drained"). Consumed ONLY by `compiler-soundness`.
      soundness_corpora: ${{ steps.classify.outputs.soundness_corpora }}
      narrow: ${{ steps.gateset.outputs.narrow }}
      gates: ${{ steps.gateset.outputs.gates }}
      oracle_key: ${{ steps.gateset.outputs.oracle_key }}
      # #2179 (project scoping in the queue), epic #2182. The ONLY output that
      # narrows a `merge_group` run, and it narrows LIBRARY-PROJECT gates only —
      # see the file header. Either the literal string `full` (run everything,
      # today's behaviour) or a space-separated list of project names whose gates
      # this queue entry must run. It is deliberately NOT `narrow`/`gates`: those
      # two carry the PR-only, per-GATE narrowing, and the compiler suite's
      # never-narrowed guarantee is keyed on them staying `false`/empty for
      # `merge_group`. A single output cannot mean both things without one
      # consumer eventually inheriting the wrong one.
      project_reach: ${{ steps.reach.outputs.project_reach }}
    steps:
      - uses: actions/checkout@v4

      - name: Classify changed files
        id: classify
        # #2179. Payload fields are read through `env:`, never interpolated into the
        # script body — `${{ }}` inside `run:` is textual substitution, so an
        # attacker-authored ref would be shell rather than data. Same rule (and the
        # same three fields) as the gate-budget override step at the bottom of this
        # file. `github.event_name` and `github.sha` are GitHub-controlled, not
        # author-controlled, but go through `env:` too so the arm has one idiom.
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}
          MG_REF: ${{ github.event.merge_group.head_ref }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -u
          event="$EVENT"
          # Consumed by `gateset` below; created unconditionally so that step never
          # has to distinguish "no non-docs files" from "the classifier bailed early".
          : > "$RUNNER_TEMP/changed.txt"
          : > "$RUNNER_TEMP/nondocs.txt"

          # #1931/#1932. EVERY conservative early exit below must publish ALL FIVE outputs,
          # not just docs_only. An output a consuming step's `if:` reads and `detect`
          # never wrote comes back as the EMPTY STRING, which is falsy — so omitting one
          # here would silently SKIP the heavy steps on push, on merge_group, and on
          # every diff this step could not resolve. That is the one direction this
          # classifier is never allowed to fail in.
          # #2179 made this reachable TWICE on one run (the merge_group arm below
          # publishes up front and then keeps going), and a repeated key in
          # $GITHUB_OUTPUT is last-wins — harmless here only because the values are
          # identical. Guarded anyway: "published once" is the property, not "the
          # duplicate happens to agree".
          published=false
          full_run() {
            [ "$published" = "false" ] || return 0
            published=true
            {
              echo "docs_only=false"
              echo "compiler_touched=true"
              echo "wasm_corpora=true"
              echo "inlang_corpora=true"
              echo "soundness_corpora=true"
            } >> "$GITHUB_OUTPUT"
          }

          # #2179. `merge_group` keeps EVERY output above at its full-run value —
          # docs_only=false and all four escape lists true, exactly as before — but
          # still needs `changed.txt`, because the `reach` step below derives the
          # library-project scoping from it. So this arm publishes the full-run
          # outputs and then FALLS THROUGH to the diff resolution instead of
          # exiting; the per-file classifier at the bottom is skipped (its `case`
          # arms only feed outputs already pinned to their full-run values), and
          # the final `>> "$GITHUB_OUTPUT"` block is skipped with it. Every other
          # non-`pull_request` event keeps the unconditional early exit.
          if [ "$event" = "merge_group" ]; then
            full_run
            echo "merge_group — the compiler suite runs FULL; resolving the diff only to scope LIBRARY-PROJECT gates (#2179)."
            # `pull_request.{base,head}.sha` are long-standing documented fields;
            # the `merge_group` payload's are NOT enumerated in GitHub's webhook
            # docs, so this must not DEPEND on their names. Same fallback ladder,
            # and the same measurement, as the gate-budget override step at the
            # bottom of this file: `github.sha` IS the queue's auto-merge commit,
            # and the queue branch is `gh-readonly-queue/<base>/pr-<N>-<base-sha>`,
            # so the base is recoverable from the ref when the field is not.
            head="$MG_HEAD"
            [ -n "$head" ] || head="$GH_SHA"
            base="$MG_BASE"
            if [ -z "$base" ]; then
              cand="${MG_REF##*-}"
              case "$cand" in
                [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) base="$cand" ;;
                *) base="" ;;
              esac
            fi
          elif [ "$event" != "pull_request" ]; then
            full_run
            echo "not a pull_request event ($event) — running the full suite."
            exit 0
          else
            base="$PR_BASE"
            head="$PR_HEAD"
          fi

          # Leaving `changed.txt` EMPTY is the fail-open signal every consumer
          # already reads (`gateset` full()s on it, and so does `reach`), so an
          # unresolvable merge_group base/head widens rather than narrows.
          if [ -z "$base" ] || [ -z "$head" ]; then
            echo "could not resolve base/head for '$event' — leaving changed.txt empty (every consumer widens to the full suite)."
            exit 0
          fi

          git cat-file -e "$base" 2>/dev/null || git fetch --no-tags --depth=1 origin "$base" 2>/dev/null || true
          git cat-file -e "$head" 2>/dev/null || git fetch --no-tags --depth=1 origin "$head" 2>/dev/null || true

          if ! git cat-file -e "$base" 2>/dev/null || ! git cat-file -e "$head" 2>/dev/null; then
            full_run
            echo "could not resolve base/head commits locally — running the full suite (conservative default)."
            exit 0
          fi

          changed="$(git diff --name-only "$base" "$head" || true)"
          if [ -z "$changed" ]; then
            full_run
            echo "no changed files resolved — running the full suite (conservative default)."
            exit 0
          fi

          echo "changed files:"
          printf '%s\n' "$changed"

          # See the job header for why this is an ALLOWLIST, not a **.md denylist.
          printf '%s\n' "$changed" > "$RUNNER_TEMP/changed.txt"

          # #2179. STOP HERE on merge_group. `changed.txt` is the only thing that
          # arm wants; the classifier below exists solely to compute docs_only and
          # the four escape lists, all of which `full_run` has already pinned to
          # their full-run values for this event. Running it would let a docs-only
          # queue entry publish docs_only=true and SKIP the heavy jobs — a
          # behaviour change nobody asked for, and the opposite of what the queue
          # is for.
          if [ "$event" = "merge_group" ]; then
            echo "merge_group — $(printf '%s\n' "$changed" | grep -c .) changed file(s) recorded for project scoping; every classifier output stays at its full-run value."
            exit 0
          fi

          docs_only=true
          # #1931 — see the job `outputs:` block for what each of these means and why
          # the build-closure predicate stays narrow while the escape lists stay
          # per-job. All three start false and are raised by the second `case` below.
          compiler_touched=false
          wasm_corpora=false
          inlang_corpora=false
          soundness_corpora=false

          # ONE classifier, TWO consumers: `docs_only` answers "is EVERY changed file
          # prose?"; `gateset` below asks "is THIS file prose?" of the same allowlist,
          # so every "not prose" arm also names the file rather than keeping a second
          # list that could drift from this one.
          nondoc() { docs_only=false; printf '%s\n' "$1" >> "$RUNNER_TEMP/nondocs.txt"; }

          while IFS= read -r f; do
            if [ -z "$f" ]; then
              continue
            fi
            # PROSE-ALLOWLIST:BEGIN — the ONLY copy of this classifier that runs in
            # CI. `compiler/tools/gate_cmd.mdk`'s `isProsePath` is a second,
            # hand-written copy of the SAME allowlist (it is what `medaka gate
            # explain` answers layer 1b with, and preflight-side callers read).
            # `test/diff_compiler_prose_classifier.sh` (#2200) extracts the block
            # between these two markers, RUNS it over a probe corpus, and diffs the
            # verdicts against `medaka gate explain --prose` — so the two copies can
            # no longer drift silently. Keep the arms, the order, and the markers
            # whole-line; edit either copy and that gate reds until both agree.
            case "$f" in
              # test/ is NEVER docs — this arm must stay first. See the job header.
              test/*) nondoc "$f" ;;

              # Syntax references and guide chapters are executable docs, not prose.
              docs/spec/SYNTAX.md) nondoc "$f" ;;
              docs/guide/*.md) nondoc "$f" ;;

              docs/*) : ;;
              LICENSE|LICENSE.*) : ;;

              # Every other .md is prose. Scoped to the extension on purpose — see
              # the job header for why a bare directory glob would be wrong.
              *.md) : ;;

              *) nondoc "$f" ;;
            esac
            # PROSE-ALLOWLIST:END

            # #1931. A SECOND, INDEPENDENT question about the SAME file, in the same
            # single pass. It is its own `case` on purpose: `case` fires only its first
            # matching arm, and the prose allowlist above already claims `test/*` with
            # its must-stay-first arm — so folding these arms into that block would make
            # test/build_native_medaka.sh (build closure) and test/wasm/* (wasm corpus)
            # unreachable. These arms are not `elif`s of the allowlist; both run for
            # every changed file.
            case "$f" in
              # ── the build closure of `./medaka`, and NOTHING else (see `outputs:`).
              # test/build_native_medaka.sh is the literal body of the `medaka` make
              # target; bootstrap_from_seed.sh and refresh_seed.sh are the cold-start
              # and re-mint halves of the same build.
              compiler/*|stdlib/*|runtime/*) compiler_touched=true ;;
              Makefile|test/build_native_medaka.sh|test/bootstrap_from_seed.sh|test/refresh_seed.sh)
                compiler_touched=true ;;
              # The workflow and the shared setup action decide HOW every job builds and
              # provisions `./medaka`. A change to either must never be able to narrow
              # itself out of the jobs it is changing.
              .github/workflows/*|.github/actions/*) compiler_touched=true ;;
            esac

            # ── `wasm`'s own escape list. Derived by reading every gate the job
            # invokes for paths outside compiler//stdlib/:
            #   diff_sqlite.sh        -> sqlite/*_probe.mdk (which import sqlite/lib/*)
            #   diff_gzip.sh          -> gzip/inflate_demo.mdk (imports gzip/lib/*)
            #   diff_playground_input -> playground/{build_playground_wasm.sh,
            #                            dev_compile_node.mjs,dist/playground.wasm},
            #                            test/engine_fixtures/*, test/engine_value_pins/*
            #   diff_wasm_typed.sh    -> test/llvm_fixtures/env_args_empty.mdk
            #   all seven + their oracle builder -> test/wasm/* (fixtures, run.js,
            #                            build_wasm_oracle.sh, the gate scripts)
            #   build_wasm_cmd.sh     -> test/build_cmd.sh, test/build_wasm_cmd.sh
            case "$f" in
              sqlite/*|gzip/*|playground/*) wasm_corpora=true ;;
              test/wasm/*|test/build_wasm_cmd.sh|test/build_cmd.sh) wasm_corpora=true ;;
              test/engine_fixtures/*|test/engine_value_pins/*|test/llvm_fixtures/*)
                wasm_corpora=true ;;
            esac

            # ── `inlang`'s own escape list: `make test`'s first line is
            # test/diff_compiler_ported.sh, which runs the test/ported/ corpus and reads
            # test/CAPABILITY-EXCEPTIONS.txt. Its remaining lines are `medaka test` over
            # compiler/ and stdlib/ files, already covered by compiler_touched.
            case "$f" in
              test/ported/*|test/diff_compiler_ported.sh|test/CAPABILITY-EXCEPTIONS.txt)
                inlang_corpora=true ;;
            esac

            # ── `compiler-soundness`'s own escape list. Derived by reading all five
            # gates that job runs for paths outside compiler//stdlib//runtime/:
            #   diff_compiler_must_fail.sh    -> test/must_fail_fixtures/*/ (the whole
            #                                    corpus: claim.txt + the .mdk it runs)
            #                                    and test/MUST-FAIL-NOT-PINNABLE.txt
            #   typecheck_compiler_source.sh  -> test/registry_keying_ratchet.sh, which
            #                                    it invokes (NOT a standalone gate — see
            #                                    that script's header for why it rides
            #                                    inside this one)
            #   check_fingerprint_parity.sh   -> nothing outside the closure (it diffs
            #                                    build_native_medaka.sh against
            #                                    compiler/driver/medaka_cli.mdk, both
            #                                    already compiler_touched)
            #   selfcompile_fixpoint.sh       -> nothing outside the closure (seed,
            #                                    runtime, stdlib, compiler)
            #   the oracle build              -> test/build_oracles.sh
            # Plus each gate SCRIPT itself: editing a gate must run that gate.
            case "$f" in
              test/must_fail_fixtures/*|test/MUST-FAIL-NOT-PINNABLE.txt) soundness_corpora=true ;;
              test/diff_compiler_must_fail.sh|test/check_fingerprint_parity.sh) soundness_corpora=true ;;
              test/typecheck_compiler_source.sh|test/registry_keying_ratchet.sh) soundness_corpora=true ;;
              test/selfcompile_fixpoint.sh|test/build_oracles.sh) soundness_corpora=true ;;
            esac
          done < "$RUNNER_TEMP/changed.txt"

          {
            echo "docs_only=$docs_only"
            echo "compiler_touched=$compiler_touched"
            echo "wasm_corpora=$wasm_corpora"
            echo "inlang_corpora=$inlang_corpora"
            echo "soundness_corpora=$soundness_corpora"
          } >> "$GITHUB_OUTPUT"
          echo "classified: docs_only=$docs_only compiler_touched=$compiler_touched wasm_corpora=$wasm_corpora inlang_corpora=$inlang_corpora soundness_corpora=$soundness_corpora"

      # ── T-15: narrow by GATE on `pull_request`. NEVER on `merge_group`. ─────────
      # Only the `pull_request` half shrinks HERE — a per-gate narrowing of
      # `merge_group` would trade away the one property that justifies the queue
      # (testing the MERGED result). The queue's own, much coarser scoping lives in
      # the `reach` step below and touches LIBRARY-PROJECT gates only (#2179); it
      # deliberately does not reuse `narrow`/`gates`, which must stay
      # `false`/empty on `merge_group` for exactly the reason in this paragraph.
      # `soundness`/`seed-health` likewise stay FULL on every event (#1932: so does
      # `compiler-soundness`, which is step-narrowed by `detect` but never by the
      # gate-set derivation below). Preflight is a
      # FILTER, not an AUTHORITY — CI on the merged tree is the authority. Incident
      # history: dossier `ci.md`.
      #
      # The derivation is `test/preflight.sh` — NOT reimplemented here, to avoid a
      # second, drift-prone copy of "which gates does this diff touch". Run in
      # `PREFLIGHT_DRY=1` mode (prints the derivation, builds nothing) against the
      # changed-file list `classify` already resolved (a shallow checkout has no
      # `main` to diff against, so `PREFLIGHT_CHANGED_FILE` parameterizes the INPUT
      # only, never the derivation).
      #
      # THREE ways this refuses to narrow, all failing SAFE (= run everything):
      #   1. preflight exits nonzero          -> a stale glob in its map, or a bug.
      #   2. preflight prints `FULL <reason>` -> whole-suite blast radius.
      #   3. preflight prints `UNMAPPED <p>`  -> no opinion about path <p>, and <p>
      #      is not prose per the SAME allowlist `classify` built (nondocs.txt).
      # A gate wrongly INCLUDED costs CI minutes, free on a public repo. A gate
      # wrongly EXCLUDED is a bug that reaches the queue. Bias accordingly, always.
      - name: Derive the gate set for this PR
        id: gateset
        run: |
          set -u
          full() {
            echo "narrow=false" >> "$GITHUB_OUTPUT"
            echo "gates=" >> "$GITHUB_OUTPUT"
            echo "oracle_key=full" >> "$GITHUB_OUTPUT"
            echo "▶ FULL SUITE: $1"
            exit 0
          }

          event="${{ github.event_name }}"
          [ "$event" = "pull_request" ] || full "event is '$event', not pull_request — no per-GATE narrowing here (merge_group scopes LIBRARY-PROJECT gates only, in the \`reach\` step below; push/schedule narrow nothing at all)."
          [ "${{ steps.classify.outputs.docs_only }}" != "true" ] || full "docs-only change — every heavy step is skipped anyway."
          [ -s "$RUNNER_TEMP/changed.txt" ] || full "no changed files resolved (conservative default)."

          if ! PREFLIGHT_DRY=1 PREFLIGHT_CHANGED_FILE="$RUNNER_TEMP/changed.txt" \
                 sh test/preflight.sh > "$RUNNER_TEMP/pf.txt" 2>&1; then
            cat "$RUNNER_TEMP/pf.txt"
            full "test/preflight.sh FAILED to derive a gate set (see above) — refusing to narrow on a broken derivation."
          fi
          cat "$RUNNER_TEMP/pf.txt"
          echo

          if grep -q '^  FULL ' "$RUNNER_TEMP/pf.txt"; then
            full "preflight reports whole-suite blast radius:$(awk '$1=="FULL"{printf " %s", $2}' "$RUNNER_TEMP/pf.txt")"
          fi

          # Every UNMAPPED path must be prose, per the SAME allowlist the docs-only
          # classifier uses. nondocs.txt is that allowlist's verdict, file by file.
          leftover=""
          for u in $(awk '$1=="UNMAPPED"{print $2}' "$RUNNER_TEMP/pf.txt"); do
            if grep -qxF "$u" "$RUNNER_TEMP/nondocs.txt"; then
              leftover="$leftover $u"
            fi
          done
          [ -z "$leftover" ] || full "preflight has no opinion about these NON-PROSE paths:$leftover"

          gates="$(awk '$1=="GATE"{printf "%s ", $2}' "$RUNNER_TEMP/pf.txt")"
          gates="${gates% }"
          [ -n "$gates" ] || full "preflight derived ZERO gates from a non-docs diff — that must never be read as 'nothing to test'."

          # Keys the per-shard oracle cache (see the `gates` job). A narrowed run builds a
          # SUBSET of a shard's oracles, so its test/bin must never be restored by a full
          # run under the same key — that would skip the build step and leave the missing
          # oracles simply ABSENT. Different content, different key.
          key="$(printf '%s' "$gates" | sha1sum | cut -c1-12)"

          echo "narrow=true" >> "$GITHUB_OUTPUT"
          echo "gates=$gates" >> "$GITHUB_OUTPUT"
          echo "oracle_key=pr-$key" >> "$GITHUB_OUTPUT"
          echo "▶ NARROWED pull_request run: $(printf '%s\n' $gates | grep -c .) gate(s)."
          echo "  The merge_group run of this same PR still executes the FULL COMPILER suite on the MERGED tree (its library-project gates are scoped by \`reach\` below)."

      # ── #2179: scope the QUEUE by PROJECT. Never by gate. ────────────────────
      # Epic #2182, docs/ops/CI-ARCHITECTURE.md §3.4. This is the first and only
      # thing that narrows a `merge_group` run, and what it narrows is the
      # LIBRARY-PROJECT gates: an entry that provably cannot reach `pds/` should
      # not spend twenty minutes proving pds still works. Everything the registry
      # marks `project = "compiler"` — the whole compiler suite, plus the
      # separately-guarded `soundness`, `compiler-soundness`, `wasm` and
      # `seed-health` jobs — runs unconditionally, exactly as before. See the file
      # header for the decision and why that half stays load-bearing.
      #
      # THE DERIVATION IS NOT REIMPLEMENTED HERE. `medaka gate reach`
      # (compiler/tools/gate_cmd.mdk) is the reference implementation of "which
      # projects can this diff reach", but no `./medaka` exists at this point in
      # the run — `detect` is upstream of the `build:` job by construction — so
      # this step reproduces its ANSWER from the two binary-free derivations that
      # already agree with it: the manifest-derived project set, and
      # `test/preflight.sh`'s dependency/corpus-widened gate derivation (the same
      # `PREFLIGHT_DRY=1` shape `gateset` above uses). Do not add a `./medaka gate
      # reach` shellout to this job; do add a case to
      # test/diff_compiler_project_enrolment.sh if these three ever drift.
      #
      # Rule 1 (DIRECT + fail-open) is the `allHit` half of `gate reach`, and it is
      # what makes this safe: unless EVERY changed path in the entry sits under a
      # library project directory, the answer is `full`. A change to ci.yml, to
      # test/gates.toml, to test/preflight.sh — to anything that decides this
      # narrowing — therefore widens rather than narrows, so the narrowing can
      # never narrow itself out of the jobs it is changing (the same invariant
      # `compiler_touched`'s `.github/**` arm carries above).
      # Rules 2 (reverse dependency: a parsec change runs sqlite's gates) and 3
      # (corpus: a gzip change runs the compiler's wasm/diff_gzip) come from
      # preflight, which already walks both graphs.
      #
      # FAIL-OPEN, ENUMERATED — every one of these answers `full`:
      #   not a merge_group event · detect resolved no changed files · no
      #   manifest-bearing project resolved · any changed path outside every
      #   project directory · preflight exiting nonzero · preflight printing
      #   `FULL` or `UNMAPPED` · a derived gate whose registry project cannot be
      #   resolved · a project-only diff that somehow derived zero project gates.
      - name: Derive the project reach for this queue entry
        id: reach
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -u
          full() {
            echo "project_reach=full" >> "$GITHUB_OUTPUT"
            echo "▶ FULL PROJECT REACH — every gate in every shard runs: $1"
            exit 0
          }

          [ "$EVENT" = "merge_group" ] || full "event is '$EVENT'; project scoping is a merge_group-only narrowing (pull_request narrows by GATE, in the step above)."
          [ -s "$RUNNER_TEMP/changed.txt" ] || full "detect resolved no changed files (conservative default)."

          # "What is a project in this monorepo?" — a directory with a
          # `medaka.toml`, outside `compiler/` and outside `test/` (those
          # manifests are loader FIXTURES). Byte-for-byte the manifest-scan
          # rule test/preflight.sh and test/diff_compiler_project_enrolment.sh's
          # PREFLIGHT leg both use.
          # ⚠️ NOT the same derivation `medaka gate reach --json` uses: that
          # binary's project universe is the registry's `project` field
          # (`projectUniverse`, compiler/tools/gate_cmd.mdk), not a manifest
          # scan — two sources, reconciled only by the enrolment gate's REACH
          # leg comparing them, never merged into one. This is also a FOURTH
          # copy of the manifest-scan half, and the enrolment gate does not
          # (yet) know about it — it re-derives the registry/preflight/floor-gate
          # legs, not this one. It is written to be textually identical to
          # preflight's so a reviewer can diff the two by eye; if it ever needs to
          # differ, teach the enrolment gate about it first.
          projects="$(git ls-files '*medaka.toml' 2>/dev/null \
            | grep -v '^test/' | grep -v '^compiler/' \
            | sed 's|/medaka\.toml$||' | sort -u | tr '\n' ' ')"
          [ -n "$projects" ] || full "no manifest-bearing project resolved — that is a broken derivation, not an empty tree."
          echo "manifest-bearing projects: $projects"

          # Rule 1, fail-open half. See the banner above.
          outside=""
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            hit=false
            for p in $projects; do
              case "$f" in "$p"/*) hit=true; break ;; esac
            done
            [ "$hit" = "true" ] || outside="$outside $f"
          done < "$RUNNER_TEMP/changed.txt"
          [ -z "$outside" ] || full "this entry touches paths outside every library project:$outside"

          if ! PREFLIGHT_DRY=1 PREFLIGHT_CHANGED_FILE="$RUNNER_TEMP/changed.txt" \
                 sh test/preflight.sh > "$RUNNER_TEMP/reach.txt" 2>&1; then
            cat "$RUNNER_TEMP/reach.txt"
            full "test/preflight.sh FAILED to derive a gate set (see above) — refusing to narrow on a broken derivation."
          fi
          cat "$RUNNER_TEMP/reach.txt"
          echo

          if grep -q '^  FULL ' "$RUNNER_TEMP/reach.txt"; then
            full "preflight reports whole-suite blast radius:$(awk '$1=="FULL"{printf " %s", $2}' "$RUNNER_TEMP/reach.txt")"
          fi
          if grep -q '^  UNMAPPED ' "$RUNNER_TEMP/reach.txt"; then
            full "preflight has no opinion about:$(awk '$1=="UNMAPPED"{printf " %s", $2}' "$RUNNER_TEMP/reach.txt")"
          fi

          # gate path -> owning project, straight out of the registry. `run =` is
          # the repo-relative gate path, which is exactly the form preflight's
          # `GATE` lines and the shard planner below both speak. Same parse as the
          # planner's; both read test/gates.toml rather than keeping a list.
          awk '
            /^\[\[gate\]\]/     { if (r != "" && p != "") print r, p; r=""; p="" }
            /^run *= *"/        { r = $0; sub(/^run *= *"/, "", r); sub(/".*$/, "", r) }
            /^project *= *"/    { p = $0; sub(/^project *= *"/, "", p); sub(/".*$/, "", p) }
            END                 { if (r != "" && p != "") print r, p }
          ' test/gates.toml > "$RUNNER_TEMP/gate_projects.txt"

          reach=""
          for g in $(awk '$1=="GATE"{print $2}' "$RUNNER_TEMP/reach.txt"); do
            p="$(awk -v g="$g" '$1==g{print $2; exit}' "$RUNNER_TEMP/gate_projects.txt")"
            [ -n "$p" ] || full "gate '$g' has no resolvable \`project\` in test/gates.toml — refusing to narrow on an incomplete registry."
            [ "$p" != "compiler" ] || continue
            case " $reach " in *" $p "*) ;; *) reach="$reach $p" ;; esac
          done
          reach="${reach# }"
          [ -n "$reach" ] || full "every path is inside a library project, yet preflight derived ZERO library-project gates — that must never be read as 'nothing to test'."

          echo "project_reach=$reach" >> "$GITHUB_OUTPUT"
          echo "▶ merge_group PROJECT REACH: $reach"
          echo "  The full compiler gate suite (registry \`project = \"compiler\"\`) runs regardless, as do soundness, compiler-soundness, wasm and seed-health."

  # ── Build ./medaka ONCE per run, not ten times (#1928) ───────────────────────
  # `make medaka` is a pure function of the checkout, so it runs once here and the
  # other ten jobs (7 `gates` shards + `compiler-soundness` + `inlang` + `wasm`) take
  # `binary: artifact` on the same setup action instead of rebuilding it. This is
  # intra-run artifact transport at a fixed SHA, NOT a cache (see the file header's
  # #111 note) — no key, no cross-SHA restore.
  #
  # ⚠️ NOT one of the required contexts (derive them: `gh api …`, see the
  # docs-only fast path note above), and must not become one — that
  # needs a ruleset edit, not atomic with a commit. ⚠️ `needs: detect` with a
  # CONDITIONAL STEP, never a conditional job — same shape and reason as every
  # heavy job below: a required consumer that `needs:` a skippable job can
  # dead-end, so this job always RUNS and always REPORTS.
  #
  # `seed-health` deliberately does NOT consume this artifact — it asks whether
  # the committed SEED still bootstraps, and must keep answering that from the
  # seed itself. History/measurements: dossier `ci.md`.
  build:
    name: build medaka once
    needs: detect
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup medaka (toolchain + build)
        if: needs.detect.outputs.docs_only != 'true'
        uses: ./.github/actions/setup-medaka
        with:
          binary: build

      # Both stamps are HIDDEN files, so `include-hidden-files: true` is mandatory —
      # upload-artifact@v4 silently drops dotfiles without it (a warning in the log,
      # a green step, and every consumer re-running stage A for nothing). Why the
      # stamp travels at all, and the same-SHA invariant that makes it sound, is
      # documented at the consuming step in .github/actions/setup-medaka/action.yml.
      #
      # `if-no-files-found: error`: an empty upload here would degrade ten jobs into
      # a download failure apiece, which is loud but points at the wrong place.
      #
      # Retention is 1 day: this artifact is scratch, meaningful only inside its own
      # run, and it is ~10 MB × every run of a busy repo.
      - name: Upload ./medaka + ./medaka_emitter + provenance stamp
        if: needs.detect.outputs.docs_only != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: medaka-binaries
          path: |
            medaka
            medaka_emitter
            .medaka_emitter.srcstamp
            .medaka.srcstamp
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  gates:
    # `build` is added to `needs` so the binaries exist; `detect` stays for its
    # outputs. See the `if:` below for why this does NOT reintroduce the
    # skipped-required-context hazard the header warns about.
    needs: [detect, build]
    # ⚠️ MUST NEVER EVALUATE FALSE FOR A REASON OTHER THAN THE WORKFLOW RUN ITSELF
    # BEING CANCELLED — this is a required context and a skipped job does not
    # report. The guard below runs on every outcome except that: `detect` failing
    # still runs this job (the download step then fails and the shard is
    # correctly red — no SKIP, no GREEN-BY-SKIP); `build` failing is the same. It
    # skips only when the run itself is being torn down (e.g. a superseding push
    # under `cancel-in-progress`), which is the one case where "does not report"
    # is itself the correct, non-mergeable signal — and it actually lets
    # cancellation stop this heavy job, which `always()` never did.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false          # one shard failing must not hide the others
      matrix:
        include:
          # Every gate in the repo lands in exactly ONE shard — verified by
          # test/diff_compiler_ci_shard_coverage.sh (0 missing, 0 duplicated). A gate
          # falling between shards would silently never run, which is the exact class
          # of rot this suite is being hardened against.
          #
          # Quoting is load-bearing on BOTH layers:
          #   * outer DOUBLE quotes -> one YAML scalar (a bare `'a' 'b'` is invalid
          #     YAML; it reads the first token and chokes on the rest);
          #   * inner SINGLE quotes -> survive into the shell so it does not expand
          #     the globs before run_gates.sh sees them.
          # And do NOT use brace expansion: run_gates.sh runs under POSIX sh (dash),
          # which does not expand braces, so it would glob to nothing.
          #
          # ── SHARDS ARE SCHEDULED BY COST, NOT BY THEME ─────────────────────────
          # Shard NAMES are thematic (they make a failure legible); the SCHEDULE is
          # not, because jobs run in parallel and total wall-clock is the SLOWEST
          # shard. So a gate lands wherever there is ROOM, not where its name says
          # — several gates below are placed far from their thematic home for
          # exactly this reason, each noted at its `pattern:` entry. Current
          # per-shard cost comes from `scripts/ci_shard_cost.sh`, run against
          # recent green `merge_group` runs — never hand-write a number here.
          # Placement history and every prior measurement: dossier `ci.md`.
          #
          # ── THE EIGHT ROWS BELOW ARE GENERATED ──────────────────────────────
          # `make gen-ci` (`medaka gate ci`) rewrites everything between the two
          # markers from `test/gates.toml`: the row order and options come from its
          # `[[shard]]` tables, each row's comment block is that row's
          # `rationale` file (`test/gate_shards/<row>.txt`) verbatim, and each
          # `pattern:` names every `[[gate]]` whose `shard` is that row. EDIT THE
          # REGISTRY, NOT THIS BLOCK — a hand edit here is reverted by the next
          # regeneration and, until then, makes ci.yml and `medaka gate list`
          # disagree about what runs where. This header comment, and every other
          # line of this file, stays hand-written.
          #
          # `pattern:` is a LITERAL NAME LIST, not the hand-written globs it
          # replaced: the registry records one `shard` per gate and no globs, so
          # the resolved set is the only thing derivable from it. The SET each row
          # resolves to through run_gates.sh's two-glob rule is unchanged.
          # GENERATED:BEGIN gates-matrix — `make gen-ci` (medaka gate ci) from test/gates.toml. DO NOT EDIT BY HAND.
          - name: gates_1
            # ROW IDENTITY, NOT PLACEMENT. Which gates run here is DERIVED
            # (`medaka gate balance`, #2178) from test/gate_cost_baseline.json and
            # regenerated into this matrix by `make gen-ci`; it changes whenever the
            # baseline does, so nothing below names a gate. What this row is:
            #
            # full_cores = true  -> the whole runner, and CLOSED TO THE PACKER. Gates
            # whose `shard` says `gates_1` stay here; the balancer never moves one in
            # or out. That is deliberate: `diff_compiler_engines` is irreducible (every
            # fixture pays a full `medaka build` + clang, on THREE engines) and wants
            # the box rather than its own ENGINE_JOBS=NCPU/2 hedge. The cost is that
            # this row runs below the median row load by construction — re-examine the
            # closure if that gap ever stops being worth it.
            #
            # wasm_arm = true  -> installs wasm-tools + Node and builds the Wasm
            # oracle, so this row's T2/T3 tiers actually run; MEDAKA_REQUIRE_WASM=1
            # makes a degraded run a hard fail rather than a quiet skip.
            #
            # The row NAME is a required status-check context (`gates_1`), so renaming it
            # is a ruleset change, not an edit here. It is a bare executor number by
            # construction (#2178): a name that cannot describe contents cannot lie
            # about them. What failed is reported by AREA, from the registry.
            pattern: "'pds/test/protocol_all_engines' 'pds/test/read_routes_all_engines' 'diff_compiler_engines' 'diff_compiler_rejection_parity'"
            full_cores: "1"
            wasm_arm: "1"
          - name: gates_2
            # ROW IDENTITY, NOT PLACEMENT. Which gates run here is DERIVED
            # (`medaka gate balance`, #2178) from test/gate_cost_baseline.json and
            # regenerated into this matrix by `make gen-ci`; it changes whenever the
            # baseline does, so nothing below names a gate. What this row is:
            #
            # full_cores = false, wasm_arm = false -> an ordinary shared runner with
            # no extra toolchain, fully open to the packer. It can take any gate that
            # does not require the Wasm toolchain, and the balancer fills it to the
            # same target load as every other open row.
            #
            # The row NAME is a required status-check context (`gates_2`), so renaming it
            # is a ruleset change, not an edit here. It is a bare executor number by
            # construction (#2178): a name that cannot describe contents cannot lie
            # about them. What failed is reported by AREA, from the registry.
            pattern: "'lsp_harness' 'gzip/test/deflate_oracle' 'pds/test/opaque_field_scalar' 'pds/test/vector_provenance' 'sqlite/test/aggregate_oracle' 'sqlite/test/left_join_oracle' 'sqlite/test/writer_oracle' 'cross_project_deps' 'diff_compiler_core_ir_run' 'diff_compiler_dict_semantics' 'diff_compiler_argtag_matrix' 'diff_compiler_error_quality_baseline' 'diff_compiler_eval_typed_modules' 'diff_compiler_iface_order' 'diff_compiler_import_order' 'diff_compiler_internal_extern' 'diff_compiler_ir_size' 'diff_compiler_lint' 'diff_compiler_llvm_symbol_collision' 'diff_compiler_prelude_shadow_census' 'diff_compiler_project_enrolment' 'diff_compiler_shadow_semantics' 'diff_compiler_slice_oob' 'diff_compiler_snapshot_frontend' 'diff_compiler_test_native' 'effect_param_domain' 'effect_product_domain' 'diff_compiler_closure_alloc'"
          - name: gates_3
            # ROW IDENTITY, NOT PLACEMENT. Which gates run here is DERIVED
            # (`medaka gate balance`, #2178) from test/gate_cost_baseline.json and
            # regenerated into this matrix by `make gen-ci`; it changes whenever the
            # baseline does, so nothing below names a gate. What this row is:
            #
            # wasm_arm = true  -> installs wasm-tools + Node and builds the Wasm
            # oracle. This is one of only two OPEN rows that carry it (the other is
            # `gates_8`), so it is one of only two rows a wasm-constrained gate can
            # legally land on — the balancer treats that as a hard constraint, never
            # as a cost, and refuses to pack rather than schedule such a gate where
            # its toolchain is absent.
            #
            # full_cores = false, so the row shares a runner and the balancer may put
