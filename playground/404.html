<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medaka</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#121826">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <!-- Cloudflare Pages serves this file with a real 404 status for any path that
       is not in the deploy. Without it, Pages falls back to index.html with 200
       for every unmatched path, which hides a missing asset from the playground's
       own fetch check (main.js reads r.ok) and from playground/verify_stdlib_deploy.sh. -->
  <style>
    html { color-scheme: dark; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #121826; color: #e6e9f0;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { text-align: center; padding: 2rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 0.5rem; }
    p { margin: 0 0 1rem; color: #aab1c2; }
    a { color: #5fd38f; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>There is nothing at this address.</p>
    <p><a href="/">Playground</a> · <a href="/guide/">Guide</a> · <a href="/stdlib/">Standard library</a></p>
  </main>
</body>
</html>
