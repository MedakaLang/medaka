[agents]
enabled = true
max_concurrent_threads_per_session = 7
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "high"

[mcp_servers.medaka]
command = "./scripts/medaka-mcp-wrapper.sh"
cwd = "."
required = true
startup_timeout_sec = 30
tool_timeout_sec = 120

# .agents/skills links to the shared .claude/skills tree for discovery.
# skills.config controls enablement; it does not register additional roots.
