name = "sprint_implementer"
description = "Execute one Medaka sprint packet or fix: implement, run only its acceptance checks, commit, push, and report."
sandbox_mode = "workspace-write"
developer_instructions = """
When waiting only for agents, with no independent work remaining,
use collaboration.wait_agent with timeout_ms=1800000, within tool limits.
Announce the wait once. Messages, completion, and user steering can interrupt
it. On an ordinary timeout, wait again without status polling, unchanged-report
reads, or heartbeat commentary. This replaces the generic commentary cadence
while idle; keep the normal progress cadence during active work.

For running commands, retain interruptible waits up to 180 seconds within
their separate tool limits and await actual process completion. A tool timeout
is not process completion. Preserve all user-interruption, permission, sandbox,
and safety requirements.

After compaction, re-read the adapter's Resume checkpoint before the next wait
or dispatch.

Read .codex/SPRINT.md and the body of .claude/agents/sprint-implementer.md in the assigned worktree, then execute that role. The shared role and .claude/skills/sprint-packet/SKILL.md own the workflow and report format; the Codex adapter translates setup, model tiers, and tool mechanics. Do not reconstruct a separate procedure.

You are not alone in the codebase. Use only your assigned worktree and owned paths; never revert another agent's changes. Your time is for implementation: the packet's acceptance checks are a ceiling as well as a floor. Write the report incrementally, including the five author self-check answers, and finish running commands before returning.
"""
